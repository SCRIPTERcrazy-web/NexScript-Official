function Grid({mode,query,filter,favs,onFav,onOpen,toast}){
  const [items,setItems]=useState([]);const [more,setMore]=useState(mode!=='fav');const [loading,setLoading]=useState(false);

// Cloudflare Turnstile widget (renders nothing when TURNSTILE_SITEKEY is empty). Bump `nonce` to reset it.
function Captcha({onToken,nonce}){
  const ref=useRef();const id=useRef();
  useEffect(()=>{
    if(!TURNSTILE_SITEKEY)return;
    const draw=()=>{if(window.turnstile&&ref.current&&id.current===undefined)id.current=window.turnstile.render(ref.current,{sitekey:TURNSTILE_SITEKEY,theme:'dark',callback:onToken,'expired-callback':()=>onToken('')})};
    if(window.turnstile)draw();else{
      let sc=document.getElementById('turnstile-api');
      if(!sc){sc=document.createElement('script');sc.id='turnstile-api';sc.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';sc.async=true;document.head.appendChild(sc)}
      sc.addEventListener('load',draw);
    }
    return()=>{try{if(window.turnstile&&id.current!==undefined)window.turnstile.remove(id.current)}catch(e){}id.current=undefined};
  },[]);
  useEffect(()=>{if(nonce&&window.turnstile&&id.current!==undefined){try{window.turnstile.reset(id.current)}catch(e){}onToken('')}},[nonce]);
  return TURNSTILE_SITEKEY?<div ref={ref}/>:null;
}

    return()=>sub.subscription.unsubscribe();
  },[]);
  const toast=useCallback(m=>{const id=Math.random();setToasts(t=>[...t,{id,m}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),4000)},[]);
  const onFav=useCallback(s=>{
    const k=s._id||s.slug;const cur=favsRef.current;const has=cur.some(x=>(x._id||x.slug)===k);
    const n=has?cur.filter(x=>(x._id||x.slug)!==k):[...cur,slim(s)];
    favsRef.current=n;setFavs(n);store.set('favs',n);
    const u=userRef.current;
    if(sb&&u&&s.slug){
      const q=has?sb.from('favorites').delete().eq('user_id',u.id).eq('slug',s.slug):sb.from('favorites').upsert({user_id:u.id,slug:s.slug,script:slim(s)});
      q.then(({error})=>{if(error){log('favorite sync error',error);toast('Could not sync favorite.')}});
    }
  },[toast]);
  const onVote=useCallback((slug,n)=>{
    const cur=votesRef.current;const x=cur[slug]===n?0:n;const nv={...cur};
    if(x===0)delete nv[slug];else nv[slug]=x;
    votesRef.current=nv;setVotes(nv);store.set('votes',nv);
    const u=userRef.current;
    if(sb&&u){
      const q=x===0?sb.from('votes').delete().eq('user_id',u.id).eq('slug',slug):sb.from('votes').upsert({user_id:u.id,slug,vote:x});
      q.then(({error})=>{if(error){log('vote sync error',error);toast('Could not sync vote.')}});
    }
  },[toast]);
  // After login: merge saved favorites/votes from the account with this device, then push anything that was only local.
  useEffect(()=>{
    if(!sb||!user)return;let dead=false;
    (async()=>{
      const [fv,vt]=await Promise.all([sb.from('favorites').select('slug,script').eq('user_id',user.id),sb.from('votes').select('slug,vote').eq('user_id',user.id)]);
      if(dead)return;
      if(fv.error||vt.error){log('sync load error',fv.error||vt.error);toast('Could not load your saved data.');return}
      const remote=fv.data.map(r=>r.script).filter(Boolean);
      const have=new Set(remote.map(x=>x.slug));
      const localOnly=favsRef.current.filter(x=>x.slug&&!have.has(x.slug));
      const merged=[...remote,...localOnly];
      favsRef.current=merged;setFavs(merged);store.set('favs',merged);
      if(localOnly.length)await sb.from('favorites').upsert(localOnly.map(x=>({user_id:user.id,slug:x.slug,script:slim(x)})));
      const rv={};vt.data.forEach(r=>{rv[r.slug]=r.vote});
      const push=[];Object.keys(votesRef.current).forEach(k=>{const val=votesRef.current[k];if(val&&rv[k]===undefined){rv[k]=val;push.push({user_id:user.id,slug:k,vote:val})}});
      votesRef.current=rv;setVotes(rv);store.set('votes',rv);
      if(push.length)await sb.from('votes').upsert(push);
      log('synced',merged.length,'favorites,',Object.keys(rv).length,'votes');
    })().catch(e=>log('sync error',e));
    return()=>{dead=true};
  },[user&&user.id]);
  const go=v=>{setView(v);setDetail(null);setOpen(false);window.scrollTo(0,0)};
  const grid=['home','trending','newest','views','rated','verified','keyless','fav'].includes(view);
  const mode=view;
  return <div className="flex min-h-screen">
    {open&&<div className="fixed inset-0 bg-black/60 z-30 md:hidden" onClick={()=>setOpen(false)}/>}
    <aside className={'fixed top-0 left-0 h-[100dvh] w-60 z-40 flex flex-col p-4 gap-1 overflow-y-auto overscroll-contain transition-transform duration-200 '+(open?'translate-x-0':'-translate-x-full md:translate-x-0')} style={{background:'rgba(8,12,40,.92)',borderRight:'1px solid rgba(255,255,255,.08)'}} aria-label="Sidebar">
      <div className="hd text-xl font-bold text-white flex items-center gap-2 mb-3"><span className="w-8 h-8 rounded-lg flex items-center justify-center" style={{background:'linear-gradient(135deg,#3b82f6,#22d3ee)'}}>S</span>ScriptFinder</div>
      {NAV.map(([id,l,ic])=><button key={id} onClick={()=>go(id)} aria-label={l} className={'flex items-center gap-3 px-3 py-3 rounded-lg text-sm text-left border-l-[3px] '+(view===id?'border-blue-400 text-white bg-gradient-to-r from-blue-500/30 to-transparent':'border-transparent text-slate-400 hover:text-white hover:bg-white/5')}><Ic n={ic} s={16}/>{l}{id==='fav'&&favs.length>0&&<span className="ml-auto text-xs">{favs.length}</span>}</button>)}
      <div className="mt-auto pt-3 border-t border-white/10">
        {user?<div className="text-xs text-slate-300"><p className="truncate mb-2" title={user.email}>{user.email}</p><button onClick={()=>sb.auth.signOut()} aria-label="Log out" className="w-full px-3 py-2 rounded-lg glass hover:border-blue-400 text-sm">Log out</button></div>
        :<button onClick={()=>go('auth')} aria-label="Log in or sign up" className="w-full px-3 py-2 rounded-lg text-sm font-semibold text-white" style={{background:'linear-gradient(135deg,#3b82f6,#60a5fa)'}}>Log in / Sign up</button>}</div>
      <div className="mt-3 pt-1 text-xs text-slate-500"><button onClick={()=>go('about')} className="flex items-center gap-2 text-slate-300 mb-2"><span className="w-8 h-8 rounded-full flex items-center justify-center text-white" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>TB</span>ThisIsBacon · View Profile</button>Powered by ScriptBlox</div>
    </aside>
    <main className="flex-1 min-w-0 md:ml-60">
      <div className="sticky top-0 z-20 p-4 space-y-3" style={{background:'rgba(10,15,44,.85)',backdropFilter:'blur(12px)'}}>
        <div className="flex items-center gap-3"><button className="md:hidden text-white p-2 -ml-2" aria-label="Open menu" onClick={()=>setOpen(true)}><Ic n="menu" s={24}/></button>
          <div className="relative flex-1"><span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"><Ic n="search"/></span>
            <input value={q} onChange={e=>{setQ(e.target.value);if(!grid)go('home')}} aria-label="Search scripts" placeholder="Search scripts, games, or creators..." className="w-full h-12 rounded-full bg-white text-slate-900 pl-12 pr-12 outline-none focus:ring-2 focus:ring-blue-500 focus:shadow-[0_0_20px_rgba(59,130,246,0.3)] placeholder:text-slate-500"/>
            {q&&<button aria-label="Clear search" onClick={()=>setQ('')} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-500 p-2"><Ic n="x"/></button>}</div></div>
        {grid&&!detail&&<div className="flex flex-wrap gap-2">{SORTS.map(([id,l])=><button key={id} onClick={()=>go(id)} className={'px-4 py-2 rounded-full text-sm '+(view===id?'bg-blue-500 text-white':'glass text-slate-300')}>{l}</button>)}
          <span className="w-px bg-white/10 mx-1"/>{FILTERS.map(([id,l])=><button key={id} onClick={()=>setFilter(id)} className={'px-3.5 py-2 rounded-full text-xs '+(filter===id?'bg-cyan-400/20 border border-cyan-400 text-cyan-200':'glass text-slate-400')}>{l}</button>)}</div>}
      </div>
      <div className="flex justify-center gap-6 px-3 md:px-5"><div className="w-full max-w-3xl min-w-0 py-3 md:py-5">
        {detail?<Detail key={detail.slug} s={detail} favs={favs} onFav={onFav} toast={toast} votes={votes} onVote={onVote} back={x=>x&&x.slug?setDetail(x):setDetail(null)}/>
        :view==='about'?<About/>:view==='donate'?<Donate/>:view==='admin'?<Admin/>:view==='auth'?<AuthPage user={user} go={go}/>:view==='upload'?<UploadPage user={user} go={go} toast={toast}/>:view==='community'?<Community favs={favs} onFav={onFav} onOpen={s=>{setDetail(s);window.scrollTo(0,0)}} toast={toast}/>
        :<div className="page">{view==='home'&&!dq&&<div className="rounded-2xl p-8 mb-6 glass"><h1 className="hd text-3xl md:text-4xl font-bold text-white">Discover <span className="text-blue-400">Roblox scripts</span> instantly</h1><p className="text-slate-300 mt-2">Browse thousands of free scripts. Fast, clean, ad-supported.</p></div>}
          <Grid mode={mode} query={dq} filter={filter} favs={favs} onFav={onFav} onOpen={s=>{setDetail(s);window.scrollTo(0,0)}} toast={toast}/></div>}
        <div className="mt-8 flex justify-center"><AdSlot kind="wide" label="bottom"/></div>
      </div>
      <div className="hidden xl:block w-40 shrink-0 sticky top-40 self-start pt-5" aria-label="Advertisement"><AdSlot kind="160x600" label="side rail"/></div>
      </div>
      <footer className="border-t border-white/10 p-6 text-sm text-slate-400"><div className="grid md:grid-cols-3 gap-6 max-w-5xl mx-auto">
        <div><h4 className="text-white mb-1">About</h4>ScriptFinder is a free Roblox script discovery tool.</div>
        <div><h4 className="text-white mb-1">Links</h4><a className="block hover:text-white" href="https://www.youtube.com/@This-IsBacon" target="_blank" rel="noopener noreferrer">YouTube</a><a className="block hover:text-white" href="https://github.com/SCRIPTERcrazy-web" target="_blank" rel="noopener noreferrer">GitHub</a></div>
        <div><h4 className="text-white mb-1">Donate</h4><a className="hover:text-white" href="https://saweria.co/MyMoneyScript" target="_blank" rel="noopener noreferrer">☕ Buy Me a Coffee</a></div></div>
        <p className="text-center mt-6">© 2026 ScriptFinder. Powered by ScriptBlox. Not affiliated with Roblox.</p></footer>
    </main>
    <div className="fixed top-4 right-4 z-50 space-y-2" aria-live="polite">{toasts.map(t=><div key={t.id} className="toast glass rounded-lg px-4 py-3 text-sm bg-red-500/20 border-red-400/40">{t.m}</div>)}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
