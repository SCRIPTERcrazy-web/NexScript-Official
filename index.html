const Skel=()=><div className="glass rounded-xl overflow-hidden"><div className="sk" style={{aspectRatio:'16/9'}}/><div className="p-2.5 space-y-2"><div className="sk h-4 rounded w-3/4"/><div className="sk h-3 rounded w-1/3"/></div></div>;

const DEFAULT_CFG={mode:'free',perPage:20,hidePatched:false,cols:2,anim:(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)?'reduced':'full'};
const pick=d=>{const r=(d&&d.result)||d||{};const list=Array.isArray(r)?r:Array.isArray(r.scripts)?r.scripts:Array.isArray(r.items)?r.items:(d&&Array.isArray(d.scripts))?d.scripts:[];return{list,next:(r&&!Array.isArray(r)&&r.nextPage)||null}};
function Grid({mode,query,filter,favs,onFav,onOpen,toast,cfg}){
  const [items,setItems]=useState([]);const [more,setMore]=useState(mode!=='fav');const [loading,setLoading]=useState(false);
  const seen=useRef(new Set());const sent=useRef();const busy=useRef(false);const pageRef=useRef(1);const moreRef=useRef(mode!=='fav');const ac=useRef();
  const C=cfg||DEFAULT_CFG;
  const key=[mode,query,filter,C.mode,C.perPage,C.hidePatched].join('|');const keyRef=useRef(key);
  const url=useCallback(p=>{
    if(mode==='fav')return null;
    // filters are applied by the API (no client-side filtering)
    const f={verified:'&verified=1',keyless:'&keyless=1',universal:'&universal=1',nokey:'&key=0',unpatched:'&patched=0',all:'',hub:''}[filter]||'';
    const pat=(C.hidePatched&&filter!=='unpatched')?'&patched=0':'';
    const max='&max='+C.perPage;
    if(query)return `/api/search?q=${encodeURIComponent(query)}&page=${p}${f}${pat}${max}`;
    if(filter==='hub'){const hs={newest:'newest',rated:'rated',updated:'newest'}[mode]||'views';return p===1?`/api/filter?filter=hub&sort=${hs}&pages=3`:null}
    if(mode==='trending'&&p===1)return '/api/trending?mode='+C.mode+max;
    const m={trending:'&sortBy=views&order=desc',newest:'&sortBy=createdAt&order=desc',updated:'&sortBy=updatedAt&order=desc',views:'&sortBy=views&order=desc',rated:'&sortBy=likeCount&order=desc',verified:'&verified=1',keyless:'&keyless=1',home:''}[mode]||'';
    return `/api/fetch?page=${p}&mode=${C.mode}${m}${f}${pat}${max}`;
  },[mode,query,filter,C.mode,C.perPage,C.hidePatched]);
  useEffect(()=>{
    keyRef.current=key;if(ac.current)ac.current.abort();
    seen.current=new Set();pageRef.current=1;moreRef.current=mode!=='fav';busy.current=false;
    setItems([]);setMore(moreRef.current);setLoading(false);setErr(false);depth.current=0;
    return()=>{if(ac.current)ac.current.abort()};
  },[key]);
  const [err,setErr]=useState(false);const depth=useRef(0);
  const okItem=useCallback(x=>{
    const F={verified:x=>!!x.verified,keyless:x=>!!x.keyless,universal:x=>!!x.isUniversal,nokey:x=>!x.key,hub:x=>!!x.isHub,unpatched:x=>!x.isPatched};
    if(F[filter]&&!F[filter](x))return false;
    if(F[mode]&&!F[mode](x))return false;
    if(C.hidePatched&&x.isPatched)return false;
    return true;
  },[filter,mode,C.hidePatched]);
  const FALLBACK={views:'/api/views?pages=1',rated:'/api/rated?pages=1',newest:'/api/newest?pages=1'};
  const load=useCallback(async()=>{
    if(busy.current||!moreRef.current)return;
    const u=url(pageRef.current);if(!u)return;
    const myKey=keyRef.current;
    busy.current=true;setLoading(true);setErr(false);ac.current=new AbortController();
    try{
      let d;
      try{d=await api(u,ac.current.signal,{immediate:pageRef.current===1,timeout:15000})}
      catch(e){
        if(e.name==='AbortError'||pageRef.current!==1||!FALLBACK[mode]||query||filter!=='all')throw e;
        log('primary endpoint failed, trying fallback',FALLBACK[mode]);d=await api(FALLBACK[mode],ac.current.signal,{immediate:true,timeout:15000});
      }
      if(myKey!==keyRef.current)return;
      const r=pick(d);let list=r.list;
      if(!list.length&&pageRef.current===1&&FALLBACK[mode]&&!query&&filter==='all'){
        log('empty result, trying fallback',FALLBACK[mode]);const d2=await api(FALLBACK[mode],ac.current.signal,{immediate:true,timeout:15000});if(myKey!==keyRef.current)return;list=pick(d2).list;
      }
      const raw=list.length;
      list=list.filter(okItem);
      if(mode==='views')list=list.slice().sort((a,b)=>(b.views||0)-(a.views||0));
      else if(mode==='rated')list=list.slice().sort((a,b)=>(b.likeCount||0)-(a.likeCount||0));
      else if(mode==='newest')list=list.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
      const fresh=list.filter(x=>{const k=x._id||x.slug;if(seen.current.has(k))return false;seen.current.add(k);return true});
      setItems(p=>[...p,...fresh]);
      const np=(mode==='trending'&&!query&&filter!=='hub'&&pageRef.current===1)?2:r.next;
      if(np)pageRef.current=np;
      moreRef.current=!!np&&raw>0;setMore(moreRef.current);
      log('loaded',u,raw,'items,',fresh.length,'kept, next page:',np||'none');
      // a filter can remove most of a page: keep loading until the screen has something to show
      if(moreRef.current&&fresh.length<6&&depth.current<6){depth.current++;setTimeout(()=>{busy.current=false;load()},0)}else depth.current=0;
    }catch(e){
      if(e.name!=='AbortError'&&myKey===keyRef.current){log('load error',e);setErr(true);toast(e.message==='Rate limited'?tr("Rate limited. Try again shortly."):tr("Failed to load scripts."))}
    }finally{
      if(myKey===keyRef.current){busy.current=false;setLoading(false)}
    }
  },[url,mode,query,filter,toast,okItem]);
  const retry=()=>{setErr(false);moreRef.current=true;setMore(true);depth.current=0;busy.current=false;load()};
  useEffect(()=>{const el=sent.current;if(!el)return;const o=new IntersectionObserver(e=>e[0].isIntersecting&&load(),{rootMargin:'300px'});o.observe(el);return()=>o.disconnect()},[load]);
  const list=mode==='fav'?favs:items;
  if(mode==='fav'&&!list.length)return <Empty t="No favorites yet" d="Tap the heart on any script to save it here."/>;
  if(err&&!list.length)return <div className="glass rounded-2xl p-10 text-center"><p className="text-white font-semibold mb-1">{tr('Failed to load scripts.')}</p><p className="text-sm text-slate-400 mb-4">{tr('The server may be slow. Please try again.')}</p><button onClick={retry} className="px-6 py-3 rounded-xl font-semibold text-white" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>{tr('Retry')}</button></div>;
  if(!loading&&!more&&!list.length)return <Empty t="No scripts found" d="Try a different keyword like 'blox fruits' or 'universal'."/>;
  const out=[];list.forEach((s,i)=>{out.push(<Card key={s._id||s.slug} i={i} s={s} fav={favs.some(f=>(f._id||f.slug)===(s._id||s.slug))} onFav={onFav} onOpen={onOpen}/>);
    if((i+1)%6===0)out.push(<div key={'ad'+i} className="col-span-full"><AdSlot kind="wide" label="in-grid"/></div>)});
  return <div><div className={'grid gap-3 md:gap-4 '+({1:'grid-cols-1',2:'grid-cols-2',3:'grid-cols-2 md:grid-cols-3'}[C.cols]||'grid-cols-2')}>{out}{loading&&Array.from({length:4}).map((_,i)=><Skel key={'s'+i}/>)}</div>
    <div ref={sent} className="h-10"/>
    <p className="text-center text-sm text-slate-400 py-4" role="status">{loading?tr("Loading more scripts..."):err?<button onClick={retry} className="px-4 py-2 rounded-lg glass">{tr('Retry')}</button>:(!more&&list.length?tr("You've reached the end"):'')}</p></div>;
}

// Cloudflare Turnstile widget (renders nothing when TURNSTILE_SITEKEY is empty). Bump `nonce` to reset it.
function Captcha({onToken,nonce}){
  const ref=useRef();const id=useRef();
  useEffect(()=>{
    if(!TURNSTILE_SITEKEY)return;
    const draw=()=>{if(window.turnstile&&ref.current&&id.current===undefined)id.current=window.turnstile.render(ref.current,{sitekey:TURNSTILE_SITEKEY,theme:'dark',callback:onToken,'expired-callback':()=>onToken('')})};
    if(window.turnstile)draw();else{
      let sc=document.getElementById('turnstile-api');
      if(!sc){sc=document.createElement('script');sc.id='turnstile-api';sc.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';sc.async=true;document.head.appendChild(sc)}
      sc.addEventListener('load',draw);
    }
    return()=>{try{if(window.turnstile&&id.current!==undefined)window.turnstile.remove(id.current)}catch(e){}id.current=undefined};
  },[]);
  useEffect(()=>{if(nonce&&window.turnstile&&id.current!==undefined){try{window.turnstile.reset(id.current)}catch(e){}onToken('')}},[nonce]);
  return TURNSTILE_SITEKEY?<div ref={ref}/>:null;
}

function AuthPage({user,go,initialTab}){
  const [tab,setTab]=useState(initialTab||'login');const [email,setEmail]=useState('');const [pw,setPw]=useState('');const [pw2,setPw2]=useState('');const [uname,setUname]=useState('');
  const [busy,setBusy]=useState(false);const [msg,setMsg]=useState('');const [cap,setCap]=useState('');const [nonce,setNonce]=useState(0);
  const [honey,setHoney]=useState('');const t0=useRef(Date.now());const guard=useRef({fails:0,until:0});
  const submit=async e=>{
    e.preventDefault();setMsg('');
    if(honey)return;                                  // bots fill the hidden field, people never see it
    if(Date.now()-t0.current<1500)return;             // too fast to be a person
    const wait=guard.current.until-Date.now();
    if(wait>0){setMsg(tr('Too many attempts. Try again in')+' '+Math.ceil(wait/1000)+'s');return}
    if(!sb){setMsg(tr("Auth service failed to load. Refresh the page."));return}
    if(TURNSTILE_SITEKEY&&!cap){setMsg(tr("Please complete the captcha."));return}
    if(tab==='signup'){
      if(!validUsername(uname.trim())){setMsg(tr("Username must be 3-20 letters, numbers or underscores, and cannot be reserved or inappropriate."));return}
      if(pw.length<8){setMsg(tr("Password must be at least 8 characters."));return}
      if(pw!==pw2){setMsg(tr("Passwords do not match."));return}
      if(!/[A-Za-z]/.test(pw)||!/[0-9]/.test(pw)){setMsg(tr('Password needs letters and numbers.'));return}
    }
    setBusy(true);
    const captcha=TURNSTILE_SITEKEY?{captchaToken:cap}:{};
    try{
      if(tab==='signup'){
        const {data:free}=await sb.rpc('username_available',{name:uname.trim()});
        if(free===false){setMsg(tr("That username is taken."));return}
        const {data,error}=await sb.auth.signUp({email:email.trim(),password:pw,options:{...captcha,data:{username:uname.trim()},emailRedirectTo:location.origin+location.pathname}});
        if(error)throw error;
        if(data.session)go('home');else setMsg(tr("Check your email to confirm your account, then log in."));
      }else{
        const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw,options:captcha});
        if(error)throw error;
        go('home');
      }
    }catch(err){log('auth error',err);guard.current.fails++;if(guard.current.fails>=5){guard.current.until=Date.now()+60000;guard.current.fails=0}setMsg(err.message||tr('Something went wrong.'))}
    finally{setBusy(false);setNonce(n=>n+1)}
  };
  if(user)return <div className="page glass rounded-2xl p-8 max-w-md mx-auto text-center space-y-3"><h1 className="hd text-2xl text-white">{tr("You're logged in")}</h1><p className="text-slate-300 break-all">{user.email}</p>
    <button onClick={()=>sb.auth.signOut()} className="px-5 py-2 rounded-lg glass hover:border-blue-400">{tr("Log out")}</button></div>;
  const inp="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/10 outline-none focus:border-blue-400 text-white placeholder:text-slate-500";
  return <form onSubmit={submit} className="page glass rounded-2xl p-6 md:p-8 max-w-md mx-auto space-y-4 glow-card">
    <div className="flex justify-center"><LogoMark/></div>
    <div className="grid grid-cols-2 gap-1 p-1 rounded-xl bg-white/5">{[['login','Log in'],['signup','Sign up']].map(([id,l])=>
      <button type="button" key={id} onClick={()=>{setTab(id);setMsg('')}} className={'py-2 rounded-lg text-sm font-semibold '+(tab===id?'bg-blue-500 text-white':'text-slate-400')}>{tr(l)}</button>)}</div>
    <h1 className="hd text-2xl text-white">{tab==='login'?tr("Welcome back"):tr("Create your account")}</h1>
    <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} placeholder={tr("Email")} aria-label={tr("Email")} autoComplete="email" className={inp}/>
    {tab==='signup'&&<><input value={uname} onChange={e=>setUname(e.target.value)} maxLength={20} required placeholder={tr("Username")} aria-label={tr("Username")} autoComplete="username" className={inp}/><p className="text-xs text-slate-400 -mt-2">{tr("Your username is permanent and shown in chat.")}</p></>}
    <input type="password" required value={pw} onChange={e=>setPw(e.target.value)} placeholder={tr("Password")} aria-label={tr("Password")} autoComplete={tab==='login'?'current-password':'new-password'} className={inp}/>
    {tab==='signup'&&<input type="password" required value={pw2} onChange={e=>setPw2(e.target.value)} placeholder={tr("Confirm password")} aria-label={tr("Confirm password")} autoComplete="new-password" className={inp}/>}
    <input type="text" name="website_url" value={honey} onChange={e=>setHoney(e.target.value)} tabIndex={-1} autoComplete="off" aria-hidden="true" style={{position:'absolute',left:'-9999px',width:1,height:1,opacity:0,pointerEvents:'none'}}/>
    <Captcha onToken={setCap} nonce={nonce}/>

  </form>;
}

function Community({favs,onFav,onOpen,toast}){
  const [items,setItems]=useState([]);const [more,setMore]=useState(!!sb);const [loading,setLoading]=useState(false);
  const pageRef=useRef(0);const busy=useRef(false);const moreRef=useRef(!!sb);const sent=useRef();
  const load=useCallback(async()=>{
    if(busy.current||!moreRef.current||!sb)return;

// Upload (logged-in users only). The server checks login + captcha and stores the script as "pending" until approved.
function UploadPage({user,go,toast}){
  const [f,setF]=useState({name:'',info:'',description:'',script:'',author:''});
  const [cap,setCap]=useState('');const [nonce,setNonce]=useState(0);const [busy,setBusy]=useState(false);const [msg,setMsg]=useState('');const [ok,setOk]=useState(false);const [mine,setMine]=useState([]);
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const uid=user&&user.id;
  const loadMine=useCallback(async()=>{
    if(!sb||!uid)return;
    const {data}=await sb.from('user_scripts').select('id,name,status,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(20);
    setMine(data||[]);
  },[uid]);
  useEffect(()=>{loadMine()},[loadMine]);
  if(!user)return <div className="page glass rounded-2xl p-8 max-w-md mx-auto text-center space-y-3"><h1 className="hd text-2xl text-white">{tr("Log in to upload")}</h1><p className="text-slate-300">{tr("Only logged-in users can upload scripts.")}</p>

  const submit=async e=>{
    e.preventDefault();setMsg('');setOk(false);
    if(!ADMIN_API){setMsg(tr("Upload server is not configured yet."));return}
    if(TURNSTILE_SITEKEY&&!cap){setMsg(tr("Please complete the captcha."));return}
    const name=f.name.trim(),info=f.info.trim(),script=f.script.trim();
    if(name.length<3){setMsg(tr("Script name must be at least 3 characters."));return}
    if(!info){setMsg(tr("Please fill in the information field."));return}
    if(!script){setMsg(tr("Please paste your script."));return}
    setBusy(true);
    try{
      const {data:{session}}=await sb.auth.getSession();
      if(!session){setMsg(tr("Session expired. Please log in again."));return}
      const r=await fetch(ADMIN_API+'/api/submit-script',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({name,info,description:f.description.trim(),script,author:f.author.trim(),captchaToken:cap})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){setMsg(d.error||('Upload failed ('+r.status+')'));return}
      setOk(true);setMsg(d.status==='approved'?tr('Published! Your script is live in Community.'):tr("Submitted! Your script will appear in Community after it is reviewed."));setF(p=>({name:'',info:'',description:'',script:'',author:p.author}));loadMine();
    }catch(err){log('upload error',err);setMsg(tr("Could not reach the upload server."))}
    finally{setBusy(false);setNonce(n=>n+1)}
  };
  const del=async id=>{const {error}=await sb.from('user_scripts').delete().eq('id',id);if(error){toast(tr("Could not delete script."))}else loadMine()};
  const inp="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/10 outline-none focus:border-blue-400 text-white placeholder:text-slate-500";
  return <div className="page space-y-5">
    <form onSubmit={submit} className="glass rounded-2xl p-5 md:p-6 space-y-3">
      <input value={f.name} onChange={set('name')} maxLength={80} placeholder={tr("Script name")} aria-label={tr("Script name")} className={inp}/>
      <input value={f.info} onChange={set('info')} maxLength={120} placeholder={tr("Information (game, version, keyless...)")} aria-label="Information" className={inp}/>
      <textarea value={f.description} onChange={set('description')} maxLength={1000} rows={4} placeholder={tr("Description")} aria-label={tr("Description")} className={inp}/>
      <textarea value={f.script} onChange={set('script')} maxLength={50000} rows={10} spellCheck={false} placeholder={tr("Paste your Lua script here")} aria-label="Script code" className={inp+' font-mono text-xs'}/>
      <input value={f.author} onChange={set('author')} maxLength={30} placeholder={tr("Display name (optional, shown publicly)")} aria-label="Display name" className={inp}/>
      <Captcha onToken={setCap} nonce={nonce}/>
      {msg&&<p className={'text-sm '+(ok?'text-green-300':'text-amber-300')} role="alert">{msg}</p>}
      <button type="submit" disabled={busy} className="w-full py-3 rounded-lg font-semibold text-white disabled:opacity-60" style={{background:'linear-gradient(135deg,#3b82f6,#60a5fa)'}}>{busy?tr("Uploading..."):tr("Upload script")}</button>
    </form>
    {mine.length>0&&<div className="glass rounded-2xl p-5"><h2 className="hd text-lg text-white mb-3">{tr("Your uploads")}</h2><ul className="space-y-2">{mine.map(m=>
      <li key={m.id} className="flex items-center gap-3 text-sm"><span className="flex-1 truncate">{m.name}</span>
        <span className={'text-[10px] px-2 py-0.5 rounded-full border '+(m.status==='approved'?'border-green-400/40 text-green-300':m.status==='rejected'?'border-red-400/40 text-red-300':'border-amber-400/40 text-amber-300')}>{m.status}</span>
        <button onClick={()=>del(m.id)} aria-label={'Delete '+m.name} className="px-3 py-2 text-slate-400 hover:text-red-300">{tr("Delete")}</button></li>)}</ul></div>}
  </div>;
}

  const petals=useMemo(()=>Array.from({length:24}).map((_,i)=>({l:(i*43)%100,d:9+(i*7)%9,dl:-((i*3)%13),sz:7+(i*5)%10,dx:(i%2?1:-1)*(30+(i*13)%90)})),[]);
  const bl=useMemo(()=>Array.from({length:34}).map((_,i)=>({x:i*47,w:30+(i*13)%34,h:60+(i*37)%150})),[]);

    {[0,1,2,3,4].map(i=><span key={i} className="streak" style={{top:(18+i*14)+'%',animationDuration:(3+i*.9)+'s',animationDelay:(-i*1.1)+'s'}}/>)}
    <div className="absolute bottom-0 left-0 h-[46%]" style={{width:'200%',animation:'scrollx 70s linear infinite',opacity:.55}}>
      <svg width="100%" height="100%" viewBox="0 0 3200 300" preserveAspectRatio="none"><g fill="#1e1b4b">{bl.map((b,i)=><rect key={i} x={b.x} y={300-b.h-40} width={b.w} height={b.h+40}/>)}{bl.map((b,i)=><rect key={'c'+i} x={b.x+1600} y={300-b.h-40} width={b.w} height={b.h+40}/>)}</g></svg></div>
    <div className="absolute bottom-0 left-0 h-[34%]" style={{width:'200%',animation:'scrollx 38s linear infinite'}}>
      <svg width="100%" height="100%" viewBox="0 0 3200 300" preserveAspectRatio="none"><g fill="#0b0b2b">{bl.map((b,i)=><rect key={i} x={b.x+20} y={300-b.h*.8-30} width={b.w+8} height={b.h*.8+30}/>)}{bl.map((b,i)=><rect key={'c'+i} x={b.x+1620} y={300-b.h*.8-30} width={b.w+8} height={b.h*.8+30}/>)}</g>
        <g fill="#fde68a">{bl.map((b,i)=>i%3===0&&<rect key={'w'+i} x={b.x+30} y={300-b.h*.8-10+(i%4)*14} width="5" height="7" style={{animation:`twinkle ${3+i%4}s ease-in-out ${i%5*.5}s infinite`}}/>)}</g></svg></div>
    <div className="absolute inset-x-0 bottom-0 h-1/3" style={{background:'linear-gradient(transparent,rgba(5,7,26,.9))'}}/>
    {petals.map((q,i)=><span key={i} className="petal" style={{left:q.l+'%',width:q.sz,height:q.sz,animationDuration:q.d+'s',animationDelay:q.dl+'s','--dx':q.dx+'px'}}/>)}
  </div>;
}

        {word.split(' ').map((w,wi)=><span key={wi} className="inline-block mr-3" style={{animation:`rise .8s cubic-bezier(.2,.8,.2,1) ${wi*.18+.2}s both`}}>{w}</span>)}</h1>

        <button onClick={()=>pick('skip')} className="px-5 py-3 text-slate-300 hover:text-white underline underline-offset-4">{tr('Skip for now')}</button></div>

// ---------- Username picker (for accounts that have no username yet) ----------
function UsernameModal({user,onSaved}){
  const [name,setName]=useState('');const [msg,setMsg]=useState('');const [busy,setBusy]=useState(false);
  const save=async e=>{
    e.preventDefault();setMsg('');const n=name.trim();
    if(!validUsername(n)){setMsg(tr('Username must be 3-20 letters, numbers or underscores, and cannot be reserved or inappropriate.'));return}
    setBusy(true);
    try{
      const {data:free}=await sb.rpc('username_available',{name:n});
      if(free===false){setMsg(tr('That username is taken.'));return}
      const {error}=await sb.from('profiles').insert({user_id:user.id,username:n});
      if(error){setMsg(error.code==='23505'?tr('That username is taken.'):tr('Could not save username.'));return}
      onSaved({username:n,role:'user'});
    }catch(err){log('username error',err);setMsg(tr('Could not save username.'))}
    finally{setBusy(false)}
  };
  return <div className="fixed inset-0 z-[55] bg-black/75 flex items-center justify-center p-4" role="dialog" aria-label="Choose a username">
    <form onSubmit={save} className="glass rounded-2xl p-6 max-w-sm w-full space-y-3" style={{background:'rgba(10,15,44,.95)'}}>
      <h2 className="hd text-xl text-white">{tr('Choose your username')}</h2>
      <p className="text-sm text-slate-300">{tr('This name is shown in chat and cannot be changed later.')}</p>
      <input value={name} onChange={e=>setName(e.target.value)} maxLength={20} autoFocus placeholder={tr('Username')} aria-label={tr("Username")} className="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/10 outline-none focus:border-blue-400 text-white"/>
      {msg&&<p className="text-amber-300 text-sm" role="alert">{msg}</p>}
      <button type="submit" disabled={busy} className="w-full py-3 rounded-lg font-semibold text-white disabled:opacity-60" style={{background:'linear-gradient(135deg,#3b82f6,#60a5fa)'}}>{busy?tr('Please wait...'):tr('Save username')}</button>
      <button type="button" onClick={()=>sb.auth.signOut()} className="w-full text-sm text-slate-400 hover:text-white">{tr('Log out')}</button>
    </form></div>;
}

const fmtSec=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');

let CHAT_DN=true;
const chatCols=()=>'id,user_id,author,role,kind,media_path,body,created_at,edited_at'+(CHAT_DN?',display_name':'');
function ChatPage({user,profile,go,toast}){
  const [msgs,setMsgs]=useState([]);const [text,setText]=useState('');const [sending,setSending]=useState(false);
  const [emoji,setEmoji]=useState(false);const [rec,setRec]=useState(null);const [editId,setEditId]=useState(null);const [editText,setEditText]=useState('');
  const listRef=useRef();const stick=useRef(true);const last=useRef(0);const fileRef=useRef();const recRef=useRef(null);const timerRef=useRef(null);
  const isStaff=!!profile&&(profile.role==='owner'||profile.role==='developer');
  const [avs,setAvs]=useState({});const avRef=useRef({});
  const ensureAv=useCallback(async list=>{
    const miss=[...new Set(list.map(x=>x.author))].filter(a=>a&&!(a in avRef.current));
    if(!miss.length||!sb)return;miss.forEach(a=>{avRef.current[a]=null});
    const {data}=await sb.from('profiles').select('username,avatar_url').in('username',miss.slice(0,100));
    if(data){const add={};data.forEach(r=>{add[r.username]=r.avatar_url;avRef.current[r.username]=r.avatar_url});setAvs(p=>({...p,...add}))}
  },[]);
  useEffect(()=>{if(profile&&profile.username){avRef.current[profile.username]=profile.avatar_url||null;setAvs(p=>({...p,[profile.username]:profile.avatar_url||null}))}},[profile]);
  useEffect(()=>{
    if(!sb)return;let dead=false;
    (async()=>{const q=()=>sb.from('chat_messages').select(chatCols()).order('id',{ascending:false}).limit(250);let r=await q();if(r.error&&/display_name/.test(r.error.message||'')){CHAT_DN=false;r=await q()}return r})().then(({data,error})=>{
      if(dead)return;if(error){log('chat load error',error);toast(tr('Could not load chat.'));return}
      setMsgs(data.slice().reverse());ensureAv(data);
    });
    const ch=sb.channel('global-chat')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},p=>{setMsgs(m=>m.some(x=>x.id===p.new.id)?m:[...m,p.new].slice(-250));ensureAv([p.new])})
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'chat_messages'},p=>{if(p.old&&p.old.id!==undefined)setMsgs(m=>m.filter(x=>x.id!==p.old.id))})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_messages'},p=>{setMsgs(m=>m.map(x=>x.id===p.new.id?{...x,...p.new}:x))})
      .subscribe();
    return()=>{dead=true;sb.removeChannel(ch)};
  },[toast]);
  useEffect(()=>{const el=listRef.current;if(el&&stick.current)el.scrollTop=el.scrollHeight},[msgs.length]);
  useEffect(()=>()=>{clearInterval(timerRef.current);if(recRef.current){recRef.current.cancel=true;try{recRef.current.mr.stop()}catch(e){}}},[]);
  const mediaUrl=path=>sb.storage.from('chat-media').getPublicUrl(path).data.publicUrl;
  const guard=()=>{
    if(!user){go('auth');return false}
    if(!profile){toast(tr('Choose a username first.'));return false}
    if(Date.now()-last.current<2000){toast(tr('Slow down a little.'));return false}
    last.current=Date.now();return true;
  };
  const post=async row=>{
    const ins=()=>sb.from('chat_messages').insert({user_id:user.id,...row}).select(chatCols()).single();
    let res=await ins();if(res.error&&/display_name/.test(res.error.message||'')){CHAT_DN=false;res=await ins()}
    const {data,error}=res;
    if(error){
      log('chat send error',error);const m=error.message||'';
      toast(m.indexOf('Inappropriate')>=0?tr('Your message contains inappropriate language.'):m.indexOf('Slow')>=0?tr('Slow down a little.'):m.indexOf('username')>=0?tr('Choose a username first.'):tr('Message not sent.'));
      return false;
    }
    bumpXp(1,'chat');stick.current=true;setMsgs(m=>m.some(x=>x.id===data.id)?m:[...m,data].slice(-250));return true;
  };
  const sendText=async e=>{
    e.preventDefault();
    const body=text.trim();if(!body)return;
    if(isProfane(body)){toast(tr('Your message contains inappropriate language.'));return}
    if(!guard())return;
    setSending(true);const ok=await post({kind:'text',body});setSending(false);
    if(ok){setText('');setEmoji(false)}
  };
  const upload=async(blob,ext,type)=>{
    const path=user.id+'/'+Date.now()+'.'+ext;
    const {error}=await sb.storage.from('chat-media').upload(path,blob,{contentType:type,cacheControl:'31536000'});
    if(error)throw error;return path;
  };
  const compress=file=>new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,1024/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('compress')),'image/jpeg',.78)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image'))};img.src=url;
  });
  const pickImage=async e=>{
    const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
    if(!/^image\//.test(f.type)){toast(tr('Please choose an image.'));return}
    if(!guard())return;
    setSending(true);
    try{const blob=await compress(f);const path=await upload(blob,'jpg','image/jpeg');await post({kind:'image',media_path:path,body:''})}
    catch(err){log('image error',err);toast(tr('Could not send image.'))}
    finally{setSending(false)}
  };
  const startRec=async()=>{
    if(!user){go('auth');return}
    if(!profile){toast(tr('Choose a username first.'));return}
    if(!navigator.mediaDevices||!window.MediaRecorder){toast(tr('Voice recording is not supported on this browser.'));return}
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(m=>MediaRecorder.isTypeSupported(m))||'';
      const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000});
      const chunks=[];mr.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data)};
      mr.onstop=async()=>{
        stream.getTracks().forEach(t=>t.stop());clearInterval(timerRef.current);
        const cancelled=recRef.current&&recRef.current.cancel;recRef.current=null;setRec(null);
        if(cancelled)return;
        const type=(mr.mimeType||mime||'audio/webm').split(';')[0];
        const ext=type.indexOf('mp4')>=0?'m4a':type.indexOf('ogg')>=0?'ogg':'webm';
        const blob=new Blob(chunks,{type});
        if(blob.size<1500){toast(tr('Recording too short.'));return}
        if(!guard())return;
        setSending(true);
        try{const path=await upload(blob,ext,type);await post({kind:'voice',media_path:path,body:''})}
        catch(err){log('voice error',err);toast(tr('Could not send voice message.'))}
        finally{setSending(false)}
      };
      recRef.current={mr,cancel:false};mr.start();setRec({sec:0});
      timerRef.current=setInterval(()=>setRec(r=>{if(!r)return r;if(r.sec>=59){try{mr.stop()}catch(e){}return r}return {sec:r.sec+1}}),1000);
    }catch(err){log('mic error',err);toast(tr('Microphone permission denied.'))}
  };
  const stopRec=()=>{if(recRef.current)try{recRef.current.mr.stop()}catch(e){}};
  const cancelRec=()=>{if(recRef.current){recRef.current.cancel=true;try{recRef.current.mr.stop()}catch(e){}}};
  const del=async m=>{
    if(!window.confirm(tr('Delete this message?')))return;
    const {error}=await sb.from('chat_messages').delete().eq('id',m.id);
    if(error){log('delete error',error);toast(tr('Could not delete message.'));return}
    setMsgs(ms=>ms.filter(x=>x.id!==m.id));
    if(m.media_path)sb.storage.from('chat-media').remove([m.media_path]).then(({error:e})=>{if(e)log('media cleanup error',e)});
  };
  const startEdit=m=>{setEditId(m.id);setEditText(m.body)};
  const saveEdit=async m=>{
    const body=editText.trim();
    if(!body||body===m.body){setEditId(null);return}
    if(isProfane(body)){toast(tr('Your message contains inappropriate language.'));return}
    const {data,error}=await sb.from('chat_messages').update({body}).eq('id',m.id).select(chatCols()).single();
    if(error){log('edit error',error);toast((error.message||'').indexOf('Inappropriate')>=0?tr('Your message contains inappropriate language.'):tr('Could not edit message.'));return}
    setMsgs(ms=>ms.map(x=>x.id===data.id?{...x,...data}:x));setEditId(null);
  };
  const ib='shrink-0 w-11 h-11 rounded-lg glass hover:border-blue-400 text-xl flex items-center justify-center';
  return <div className="page glass rounded-2xl p-4 md:p-5 space-y-3">
    <p className="text-xs text-slate-400 text-right">{tr('Last 250 messages')}</p>
    <div ref={listRef} onScroll={e=>{const el=e.target;stick.current=el.scrollHeight-el.scrollTop-el.clientHeight<120}} className="h-[55vh] overflow-y-auto overscroll-contain space-y-2 pr-1" aria-live="polite">
      {msgs.length===0&&<p className="text-center text-slate-500 text-sm pt-10">{tr('No messages yet. Say hi!')}</p>}
      {msgs.map(m=>{const mine=user&&m.user_id===user.id;return <div key={m.id} className="flex gap-2 items-start">
        <Avatar name={m.author} role={m.role} url={avs[m.author]} size={34}/>
        <div className={'rounded-xl px-3 py-2 text-sm min-w-0 flex-1 '+(m.role==='owner'?'bg-amber-400/10 border border-amber-300/40':mine?'bg-blue-500/20 border border-blue-400/30':'bg-white/5')}>
          <div className="flex items-center gap-2 flex-wrap"><span className={'font-semibold truncate '+(m.role==='owner'?'owner-name':'text-blue-300')}>{m.display_name||m.author}</span>{m.display_name&&<span className="text-[10px] text-slate-500 truncate">@{m.author}</span>}<RoleBadge role={m.role}/><span className="text-[10px] text-slate-500">{ago(m.created_at)}</span>
            <span className="ml-auto flex">{mine&&m.kind==='text'&&<button onClick={()=>startEdit(m)} aria-label="Edit message" className="px-2.5 py-2 text-xs text-slate-500 hover:text-blue-300"><Ic n="edit" s={14}/></button>}{(mine||isStaff)&&<button onClick={()=>del(m)} aria-label="Delete message" className="px-2.5 py-2 text-xs text-slate-500 hover:text-red-300"><Ic n="x" s={14}/></button>}</span></div>
          {m.kind==='image'&&m.media_path?<img src={mediaUrl(m.media_path)} alt="Chat photo" loading="lazy" className="mt-1 max-h-64 rounded-lg cursor-pointer" onClick={()=>window.open(mediaUrl(m.media_path),'_blank','noopener')}/>
          :m.kind==='voice'&&m.media_path?<audio className="mt-1 w-full max-w-xs" controls preload="none" src={mediaUrl(m.media_path)}/>
          :editId===m.id?<div className="mt-1 space-y-2"><textarea value={editText} onChange={e=>setEditText(e.target.value)} maxLength={300} rows={2} autoFocus aria-label="Edit message" className="w-full px-3 py-2 rounded-lg bg-white/10 border border-white/10 outline-none focus:border-blue-400 text-white"/><div className="flex gap-2 justify-end"><button onClick={()=>setEditId(null)} className="px-4 py-2 rounded-lg glass text-xs">{tr('Cancel')}</button><button onClick={()=>saveEdit(m)} className="px-4 py-2 rounded-lg text-xs font-semibold text-white" style={{background:'linear-gradient(135deg,#3b82f6,#60a5fa)'}}>{tr('Save')}</button></div></div>
          :<p className="text-slate-200 break-words whitespace-pre-wrap">{m.body}{m.edited_at&&<span className="text-[10px] text-slate-500 ml-1">({tr('edited')})</span>}</p>}
        </div></div>})}
    </div>
    {user&&profile?<div className="space-y-2">
      {emoji&&<div className="glass rounded-xl p-2 grid grid-cols-8 gap-1 max-h-40 overflow-y-auto">{EMOJIS.map(e=><button type="button" key={e} onClick={()=>setText(t=>(t+e).slice(0,300))} aria-label={'Emoji '+e} className="text-xl p-1 rounded hover:bg-white/10">{e}</button>)}</div>}
      {rec?<div className="flex items-center gap-3"><span className="text-red-400 animate-pulse font-semibold"><i className="inline-block w-2.5 h-2.5 rounded-full bg-red-400 mr-1.5"/>{fmtSec(rec.sec)}</span>
        <button onClick={cancelRec} className="px-4 py-3 rounded-lg glass text-sm">{tr('Cancel')}</button>
        <button onClick={stopRec} className="px-4 py-3 rounded-lg font-semibold text-white text-sm" style={{background:'linear-gradient(135deg,#3b82f6,#60a5fa)'}}>{tr('Send voice')}</button></div>
      :<form onSubmit={sendText} className="flex gap-2 items-center">
        <button type="button" onClick={()=>setEmoji(v=>!v)} aria-label="Emoji" className={ib}><Ic n="smile" s={20}/></button>

function touchStreak(){
  const st=readStats();const t=todayStr();if(st.last===t)return st;

}

  const lv=levelOf(st.xp),lo=10*(lv-1)*(lv-1),hi=10*lv*lv,pct=Math.max(0,Math.min(100,Math.round((st.xp-lo)/(hi-lo)*100)));

// ---------- Shorts feed: videos pulled from YouTube (through our server, which holds the YouTube API key) ----------
const SHORT_TOPICS=[['mix','For You'],['roblox','Roblox'],['blox','Blox Fruits'],['meme','Memes'],['comedy','Comedy'],['dance','Dance'],['history','History 3D'],['gaming','Gaming'],['anime','Anime'],['satisfying','Satisfying'],['animals','Animals'],['sports','Sports'],['cars','Cars'],['science','Science'],['cooking','Food'],['music','Music'],['art','Art'],['magic','Magic'],['tech','Tech']];
function ShortsFeed({toast,go}){
  const [sel,setSel]=useState(()=>{const t=store.get('nx_topics',['mix']);return Array.isArray(t)&&t.length?t:['mix']});
  const [items,setItems]=useState([]);const [loading,setLoading]=useState(false);const [failed,setFailed]=useState(false);const [active,setActive]=useState(0);
  const [info,setInfo]=useState(null);const [blocked,setBlocked]=useState(null);const [lockFrom,setLockFrom]=useState(null);const [failMsg,setFailMsg]=useState('');const reported=useRef(new Set());
  const busy=useRef(false);const box=useRef();const selKey=sel.join(',');const selRef=useRef(selKey);const idsRef=useRef(new Set());
  const frameRef=useRef();const [muted,setMuted]=useState(false);const [paused,setPaused]=useState(false);const firstTap=useRef(true);
  useEffect(()=>{setMuted(false);setPaused(false);firstTap.current=true},[active]);
  useEffect(()=>{if(items.length)window.dispatchEvent(new Event('nx-pause-music'))},[active,items.length>0]);
  useEffect(()=>{const v=items[active];if(!v)return;const sn=store.get('nx_seen_shorts',[]);if(sn[sn.length-1]!==v.id){sn.push(v.id);store.set('nx_seen_shorts',sn.slice(-400))}},[active,items.length]);
  const cmd=(func,args)=>{try{if(frameRef.current)frameRef.current.contentWindow.postMessage(JSON.stringify({event:'command',func,args:args||[]}),'*')}catch(e){}};
  const toggleMute=e=>{e.stopPropagation();if(muted){cmd('unMute');cmd('setVolume',[80])}else cmd('mute');setMuted(m=>!m)};
  const onFrameLoad=()=>{[400,1200,2600].forEach(ms=>setTimeout(()=>{cmd('unMute');cmd('setVolume',[90]);cmd('playVideo')},ms))};
  const togglePlay=()=>{
    if(firstTap.current){firstTap.current=false;if(/iPhone|iPad|iPod/.test(navigator.userAgent)){cmd('unMute');cmd('playVideo');setMuted(false);setPaused(false);return}}
    cmd(paused?'playVideo':'pauseVideo');setPaused(v=>!v)};
  const load=useCallback(async()=>{
    if(busy.current)return;
    if(!ADMIN_API){setFailed(true);return}
    const myKey=selRef.current;busy.current=true;setLoading(true);
    try{
      let token='';try{if(sb){const sess=await sb.auth.getSession();token=sess.data.session?sess.data.session.access_token:''}}catch(e){}
      const seen=store.get('nx_seen_shorts',[]);
      const exclude=seen.slice(-110).concat(Array.from(idsRef.current)).slice(-190);
      const r=await fetch(ADMIN_API+'/api/youtube-feed',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{}),body:JSON.stringify({topics:myKey.split(','),exclude,n:6})});
      const d=await r.json().catch(()=>({}));
      if(myKey!==selRef.current)return;
      if(r.status===429){setBlocked(d);setInfo(d);setLockFrom(p=>p===null?idsRef.current.size:p);return}
      if(!r.ok){setFailMsg((d.error||'')+(d.step?' ('+d.step+')':'')+(d.detail?': '+d.detail:'')||('HTTP '+r.status));throw new Error('HTTP '+r.status)}
      setInfo(d);setBlocked(null);setFailMsg('');
      const got=d.items||[];
      const fresh=got.filter(v=>v&&v.id&&/^[\w-]{11}$/.test(v.id)&&!idsRef.current.has(v.id)&&!isProfane(v.title||''));
      fresh.forEach(v=>idsRef.current.add(v.id));
      setItems(p=>[...p,...fresh]);setFailed(false);
      if(!got.length){setFailed(true);if(d.reason)setFailMsg(d.reason)}
    }catch(e){log('shorts error',e);if(myKey===selRef.current)setFailed(true)}
    finally{busy.current=false;setLoading(false)}
  },[]);
  useEffect(()=>{
    selRef.current=selKey;idsRef.current=new Set();busy.current=false;
    setItems([]);setActive(0);setFailed(false);setBlocked(null);setLockFrom(null);if(box.current)box.current.scrollTop=0;
    load();
  },[selKey,load]);
  const onScroll=e=>{
    const el=e.target;const i=Math.round(el.scrollTop/Math.max(1,el.clientHeight));setActive(i);
    if(i>=items.length-3&&!busy.current&&!blocked&&lockFrom===null)load();
  };
  const report=useCallback(async(id,idx)=>{
    if(reported.current.has(id))return;reported.current.add(id);
    try{
      let token='';try{if(sb){const sess=await sb.auth.getSession();token=sess.data.session?sess.data.session.access_token:''}}catch(e){}
      const r=await fetch(ADMIN_API+'/api/youtube-feed',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{}),body:JSON.stringify({action:'view',id})});
      const d=await r.json().catch(()=>null);
      if(!r.ok||!d)return;
      setInfo(d);
      if(!d.counted||d.remaining<=0)setLockFrom(idx+1);
    }catch(e){log('view report error',e)}
  },[]);
  useEffect(()=>{
    const v=items[active];if(!v||!ADMIN_API)return;
    if(lockFrom!==null&&active>=lockFrom)return;
    if(reported.current.has(v.id))return;
    const t=setTimeout(()=>report(v.id,active),2500);
    return()=>clearTimeout(t);
  },[active,items.length,lockFrom,report]);
  const toggleTopic=id=>{
    let n;
    if(id==='mix')n=['mix'];else{n=sel.filter(x=>x!=='mix');n=n.includes(id)?n.filter(x=>x!==id):[...n,id];if(!n.length)n=['mix']}
    setSel(n);store.set('nx_topics',n);
  };
  const leftText=info&&info.resetAt?(()=>{const ms=Math.max(0,info.resetAt-Date.now());return Math.floor(ms/36e5)+'h '+Math.floor(ms%36e5/6e4)+'m'})():'';
  const lockCard=<div className="absolute inset-0 flex flex-col items-center justify-center gap-3 p-6 text-center" style={{background:'rgba(5,7,26,.92)'}}><p className="hd text-xl text-white">{tr('Daily limit reached')}</p><p className="text-sm text-slate-400">{tr('Resets in')} {leftText} (00:00 WIB)</p><button onClick={()=>go('wallet')} className="px-6 py-3 rounded-xl font-semibold text-white" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>{tr('Upgrade')}</button></div>;
  return <div className="page space-y-3">
    <div className="flex gap-2 overflow-x-auto pb-1 nx-chips">{SHORT_TOPICS.map(([id,l])=><button key={id} onClick={()=>toggleTopic(id)} className={'shrink-0 px-4 py-2 rounded-full text-sm '+(sel.includes(id)?'bg-blue-500 text-white':'glass text-slate-300')}>{tr(l)}</button>)}</div>
    {info&&<div className="flex items-center justify-between gap-2 text-xs text-slate-400"><span>{tr('Shorts left today')}: <b className="text-white">{info.remaining}</b>/{info.limit} - {tr(({guest:'Guest',free:'Free',pro:'Pro',premium:'Premium'})[info.tier]||'Free')}</span>{info.tier!=='premium'&&<button onClick={()=>go('wallet')} className="px-3 py-1.5 rounded-lg glass text-xs text-amber-300">{tr('Upgrade')}</button>}</div>}
    {blocked&&!items.length?<div className="glass rounded-2xl p-10 text-center"><p className="hd text-xl text-white mb-1">{tr('Daily limit reached')}</p><p className="text-sm text-slate-400 mb-4">{tr('Resets in')} {leftText} (00:00 WIB)</p><button onClick={()=>go('wallet')} className="px-6 py-3 rounded-xl font-semibold text-white" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>{tr('Upgrade')}</button></div>
    :failed&&!items.length?<div><Empty t="Shorts are not available right now" d="Please try again later."/>{failMsg&&<p className="text-[11px] text-slate-500 text-center mt-2 break-words">{failMsg}</p>}<div className="text-center mt-3"><button onClick={()=>{setFailed(false);setFailMsg('');load()}} className="px-5 py-2 rounded-lg glass text-sm">{tr('Retry')}</button></div></div>
    :<div ref={box} tabIndex={0} onScroll={onScroll} className="feed overflow-y-auto snap-y snap-mandatory overscroll-contain rounded-2xl" style={{height:'calc(100dvh - 210px)',minHeight:420,scrollbarWidth:'none'}}>
      {items.map((v,i)=><section key={v.id} className="snap-start snap-always h-full p-1"><div className="h-full rounded-2xl overflow-hidden glass flex flex-col">
        <div className="relative flex-1 min-h-0 bg-black">
          {lockFrom!==null&&i>=lockFrom
            ?lockCard
            :i===active
            ?<><iframe ref={frameRef} onLoad={onFrameLoad} title={v.title} src={'https://www.youtube.com/embed/'+v.id+'?autoplay=1&mute=0&loop=1&playlist='+v.id+'&playsinline=1&rel=0&modestbranding=1&controls=0&enablejsapi=1&origin='+encodeURIComponent(location.origin)} allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowFullScreen className="absolute inset-0 w-full h-full border-0 pointer-events-none"/>
              <div className="absolute inset-0" style={{touchAction:'pan-y'}} onClick={togglePlay} aria-label={paused?tr('Play'):tr('Pause')}/>
              <button onClick={toggleMute} className="absolute bottom-3 right-3 px-4 py-2 rounded-full text-xs font-semibold text-white bg-black/60 border border-white/20">{muted?tr('Sound off'):tr('Sound on')}</button></>
            :<img src={'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg'} alt={v.title} loading="lazy" className="absolute inset-0 w-full h-full object-cover opacity-80"/>}
        </div>
        <div className="p-3 flex items-center gap-3"><div className="min-w-0 flex-1"><h2 className="hd text-base font-bold text-white line-clamp-2">{v.title}</h2><p className="text-xs text-slate-400 truncate">{v.channel}</p></div>
          <a href={'https://www.youtube.com/watch?v='+v.id} target="_blank" rel="noopener noreferrer" className="shrink-0 px-4 py-3 rounded-xl text-sm font-semibold glass hover:border-blue-400">{tr('Open on YouTube')}</a></div>
      </div></section>)}
      {lockFrom!==null&&lockFrom>=items.length&&<section className="snap-start snap-always h-full p-1"><div className="relative h-full rounded-2xl overflow-hidden glass" style={{minHeight:300}}>{lockCard}</div></section>}
      {loading&&lockFrom===null&&<section className="snap-start h-full flex items-center justify-center text-slate-400" style={{minHeight:300}}>{tr('Loading more scripts...')}</section>}
    </div>}
  </div>;
}

const API_CHECKS=['/api/fetch?page=1&mode=free','/api/fetch?page=1&mode=free&sortBy=views&order=desc','/api/fetch?page=1&mode=free&sortBy=likeCount&order=desc','/api/fetch?page=1&mode=free&verified=1','/api/fetch?page=1&mode=free&keyless=1','/api/trending','/api/views?pages=1','/api/rated?pages=1','/api/filter?filter=hub&sort=views&pages=1','/api/search?q=blox+fruits&page=1'];
function ApiCheck(){
  const [rows,setRows]=useState([]);const [run,setRun]=useState(false);
  const start=async()=>{
    setRun(true);setRows([]);
    for(const path of API_CHECKS){
      const t0=Date.now();const r={path,ok:false,ms:0,n:0,msg:''};
      try{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),15000);const res=await fetch(API+path,{signal:ac.signal});clearTimeout(to);r.ms=Date.now()-t0;
        if(!res.ok)r.msg='HTTP '+res.status;else{const d=await res.json();const l=pick(d).list;r.n=l.length;r.ok=l.length>0;if(!l.length)r.msg='empty'}}
      catch(e){r.ms=Date.now()-t0;r.msg=e.name==='AbortError'?'timeout':'error'}
      setRows(x=>[...x,r]);
    }
    setRun(false);
  };
  return <div className="glass rounded-2xl p-5"><h2 className="hd text-lg text-white mb-3">{tr('API check')}</h2>
    <button onClick={start} disabled={run} className="px-4 py-2 rounded-lg glass hover:border-blue-400 text-sm disabled:opacity-60">{run?tr('Testing...'):tr('Run test')}</button>
    <div className="mt-3 space-y-1">{rows.map(r=><div key={r.path} className="flex items-center gap-2 text-xs"><i className={'w-2 h-2 rounded-full '+(r.ok?'bg-green-400':'bg-red-400')}/><span className="flex-1 min-w-0 truncate text-slate-300">{r.path}</span><span className="text-slate-400">{r.ok?r.n+' items':r.msg} - {r.ms}ms</span></div>)}</div></div>;
}

const ACHS=[['First favorite','tot','fav',1],['Collector','tot','fav',10],['Copy master','tot','copy',25],['Critic','tot','rate',5],['Chatterbox','tot','chat',10],['Browse 50 scripts','tot','view',50],['7 day streak','streak','',7],['Reach level 5','level','',5]];
function useRw(){
  const [rw,setRw]=useState(readRw);
  useEffect(()=>{const h=()=>setRw(readRw());window.addEventListener('nx-rewards',h);window.addEventListener('nx-xp',h);return()=>{window.removeEventListener('nx-rewards',h);window.removeEventListener('nx-xp',h)}},[]);
  return rw;
}
function FrameWrap({id,children}){
  const f=FRAMES.find(x=>x[0]===id)||FRAMES[0];
  if(id==='rainbow')return <span className="relative inline-flex rounded-full shrink-0" style={{padding:3}}><span className="absolute inset-0 rounded-full ring-rainbow" aria-hidden="true"/><span className="relative inline-flex rounded-full" style={{background:'#0a0f2c'}}>{children}</span></span>;
  return <span className="rounded-full inline-flex shrink-0" style={{boxShadow:f[3]}}>{children}</span>;
}
function FramedAvatar({children}){
  const rw=useRw();const lv=levelOf(readStats().xp);const f=FRAMES.find(x=>x[0]===rw.frame&&(UNLOCK_ALL||lv>=x[2]));
  return <FrameWrap id={f?f[0]:'none'}>{children}</FrameWrap>;
}
const TitleText=({id,children})=><span className={{newcomer:'text-slate-400',explorer:'text-cyan-300',hunter:'text-violet-300',legend:'t-legend',mythic:'t-mythic'}[id]||'text-slate-400'}>{children}</span>;
function TitleLine(){
  const rw=useRw();const lv=levelOf(readStats().xp);const t=TITLES.find(x=>x[0]===rw.title&&(UNLOCK_ALL||lv>=x[2]))||TITLES[0];
  return <span className="text-[10px] block truncate"><TitleText id={t[0]}>{tr(t[1])}</TitleText></span>;
}
function XpChip({onClick}){
  const [st,setSt]=useState(readStats);
  useEffect(()=>{const h=()=>setSt(readStats());window.addEventListener('nx-xp',h);return()=>window.removeEventListener('nx-xp',h)},[]);
  const lv=levelOf(st.xp),lo=10*(lv-1)*(lv-1),hi=10*lv*lv,pct=Math.max(0,Math.min(100,Math.round((st.xp-lo)/(hi-lo)*100)));
  return <button onClick={onClick} aria-label="XP" className="shrink-0 h-12 px-3 rounded-full glass flex items-center gap-2 text-xs text-white"><span className="font-semibold">Lv {lv}</span><span className="w-10 h-1.5 rounded-full bg-white/15 overflow-hidden hidden sm:block"><span className="block h-full rounded-full" style={{width:pct+'%',background:'linear-gradient(90deg,#3b82f6,#22d3ee)'}}/></span><span className="text-slate-300">{st.xp}</span></button>;
}
function Confetti({k}){
  const [on,setOn]=useState(false);
  useEffect(()=>{if(!k)return;setOn(true);const t=setTimeout(()=>setOn(false),2800);return()=>clearTimeout(t)},[k]);
  if(!on)return null;
  const cols=['#60a5fa','#a78bfa','#22d3ee','#f472b6','#fbbf24','#34d399'];
  return <div aria-hidden="true">{Array.from({length:44}).map((_,i)=><i key={i} className="confetti" style={{left:((i*23+7)%100)+'%',background:cols[i%cols.length],animationDelay:((i%11)*.08)+'s','--dx':((i%2?1:-1)*(20+(i*13)%90))+'px'}}/>)}</div>;
}
function RewardsPage({toast,profile}){
  const [st,setSt]=useState(readStats);const rw=useRw();
  useEffect(()=>{const h=()=>setSt(readStats());window.addEventListener('nx-xp',h);return()=>window.removeEventListener('nx-xp',h)},[]);
  const lv=levelOf(st.xp),lo=10*(lv-1)*(lv-1),hi=10*lv*lv,pct=Math.max(0,Math.min(100,Math.round((st.xp-lo)/(hi-lo)*100)));
  const quests=todaysQuests();
  const claim=q=>{const o=readRw();if(o.claimed[q.id]||(o.counts[q.id]||0)<q.n)return;o.claimed[q.id]=true;writeRw(o);bumpXp(q.xp);toast(tr('Quest complete!')+' +'+q.xp+' XP','ok')};
  const [spinning,setSpinning]=useState(false);const [deg,setDeg]=useState(0);const [won,setWon]=useState(null);
  const canSpin=rw.spin!==todayStr()&&!spinning;
  const spin=()=>{
    if(!canSpin)return;
    const pool=[5,5,5,10,10,10,15,15,25,25,50,100];const v=pool[Math.floor(Math.random()*pool.length)];
    const idxs=WHEEL.map((x,i)=>x===v?i:-1).filter(i=>i>=0);const i=idxs[Math.floor(Math.random()*idxs.length)];
    setSpinning(true);setWon(null);
    setDeg(d=>d-(d%360)+360*6+(360-(i*45+22.5)));
    setTimeout(()=>{const o=readRw();o.spin=todayStr();writeRw(o);bumpXp(v);setWon(v);setSpinning(false)},4200);
  };
  const equip=(k,id)=>{const o=readRw();o[k]=id;writeRw(o)};
  const prog=a=>a[1]==='tot'?((rw.tot||{})[a[2]]||0):a[1]==='streak'?st.streak:lv;
  const frame=FRAMES.find(f=>f[0]===rw.frame&&(UNLOCK_ALL||lv>=f[2]))||FRAMES[0];
  const nextPerk=[...FRAMES.map(f=>[f[2],f[1]]),...TITLES.map(t=>[t[2],t[1]])].filter(x=>!UNLOCK_ALL&&x[0]>lv).sort((a,b)=>a[0]-b[0])[0];
  return <div className="page space-y-5">
    <div className="glass rounded-2xl p-5 glow-card"><div className="flex items-center gap-4">
      <FrameWrap id={frame[0]}><Avatar name={profile?profile.username:'You'} role={profile&&profile.role} url={profile&&profile.avatar_url} size={64}/></FrameWrap>
      <div className="min-w-0 flex-1"><p className="hd text-2xl text-white">{tr('Level')} {lv}</p><p className="text-xs text-slate-400">{st.xp} XP - <Ic n="flame" s={12}/> {st.streak} {tr('day streak')}</p>
        <div className="xpbar h-2.5 rounded-full bg-white/10 mt-2"><div className="h-full rounded-full" style={{width:pct+'%',background:'linear-gradient(90deg,#3b82f6,#22d3ee)',transition:'width .6s'}}/></div>
        {nextPerk&&<p className="text-[11px] text-slate-400 mt-1">{tr('Next perk')}: {tr(nextPerk[1])} ({tr('Level')} {nextPerk[0]})</p>}</div></div>
      {UNLOCK_ALL&&<p className="text-xs text-amber-300 mt-3">{tr('All perks unlocked for the owner.')}</p>}
      <p className="text-xs text-slate-400 mt-3">{tr('XP unlocks frames and titles. Earn XP by copying, favoriting, rating, chatting and daily quests.')}</p></div>

    <div className="glass rounded-2xl p-5"><h2 className="hd text-lg text-white mb-3">{tr('Daily quests')}</h2>
      <div className="space-y-3">{quests.map(q=>{const c=Math.min(q.n,(rw.counts||{})[q.id]||0);const done=c>=q.n;const got=!!(rw.claimed||{})[q.id];return <div key={q.id} className="flex items-center gap-3">
        <div className="flex-1 min-w-0"><p className="text-sm text-white">{tr(q.t)}</p><div className="h-1.5 rounded-full bg-white/10 mt-1.5 overflow-hidden"><div className="h-full rounded-full" style={{width:(c/q.n*100)+'%',background:'linear-gradient(90deg,#3b82f6,#22d3ee)',transition:'width .5s'}}/></div><p className="text-[10px] text-slate-500 mt-1">{c}/{q.n}</p></div>
        <button onClick={()=>claim(q)} disabled={!done||got} className={'shrink-0 px-4 py-2 rounded-lg text-xs font-semibold '+(got?'glass text-slate-500':done?'text-white':'glass text-slate-400')} style={done&&!got?{background:'linear-gradient(135deg,#22c55e,#16a34a)'}:undefined}>{got?tr('Claimed'):('+'+q.xp+' XP')}</button></div>})}</div></div>

    <div className="glass rounded-2xl p-5 text-center"><h2 className="hd text-lg text-white">{tr('Daily spin')}</h2><p className="text-xs text-slate-400 mb-4">{tr('Spin the wheel once a day for bonus XP.')}</p>
      <div className="relative mx-auto" style={{width:224,height:224}}>
        <div className="absolute left-1/2 z-10" style={{top:-8,transform:'translateX(-50%)',width:0,height:0,borderLeft:'10px solid transparent',borderRight:'10px solid transparent',borderTop:'18px solid #fbbf24'}}/>
        <div className="w-full h-full rounded-full border-4 border-white/20 relative" style={{background:'conic-gradient(#3b82f6 0 45deg,#8b5cf6 45deg 90deg,#22d3ee 90deg 135deg,#f472b6 135deg 180deg,#3b82f6 180deg 225deg,#fbbf24 225deg 270deg,#8b5cf6 270deg 315deg,#22c55e 315deg 360deg)',transform:'rotate('+deg+'deg)',transition:spinning?'transform 4s cubic-bezier(.12,.7,.1,1)':'none'}}>
          {WHEEL.map((v,i)=><span key={i} className="absolute left-1/2 top-1/2 text-xs font-bold text-white" style={{transform:'rotate('+(i*45+22.5)+'deg) translateY(-84px) translateX(-50%)'}}>{v}</span>)}</div></div>
      <button onClick={spin} disabled={!canSpin} className="mt-5 px-8 py-3 rounded-xl font-semibold text-white disabled:opacity-50" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>{canSpin?tr('Spin'):(spinning?'...':tr('Come back tomorrow'))}</button>
      {won!==null&&<p className="text-green-300 font-semibold mt-3">{tr('You won')} +{won} XP</p>}</div>

    <div className="glass rounded-2xl p-5"><h2 className="hd text-lg text-white mb-3">{tr('Frames')}</h2>
      <div className="flex flex-wrap gap-2">{FRAMES.map(f=>{const un=UNLOCK_ALL||lv>=f[2];return <button key={f[0]} disabled={!un} onClick={()=>equip('frame',f[0])} className={'px-3 py-2 rounded-lg text-xs '+(rw.frame===f[0]&&un?'bg-blue-500 text-white':'glass '+(un?'text-slate-200':'text-slate-500'))}>{tr(f[1])}{!un&&' ('+tr('Level')+' '+f[2]+')'}</button>})}</div>
      <h2 className="hd text-lg text-white mt-5 mb-3">{tr('Titles')}</h2>
      <div className="flex flex-wrap gap-2">{TITLES.map(t=>{const un=UNLOCK_ALL||lv>=t[2];return <button key={t[0]} disabled={!un} onClick={()=>equip('title',t[0])} className={'px-3 py-2 rounded-lg text-xs '+(rw.title===t[0]&&un?'bg-blue-500 text-white':'glass '+(un?'text-slate-200':'text-slate-500'))}><TitleText id={un?t[0]:'locked'}>{tr(t[1])}</TitleText>{!un&&' ('+tr('Level')+' '+t[2]+')'}</button>})}</div></div>

    <div className="glass rounded-2xl p-5"><h2 className="hd text-lg text-white mb-3">{tr('Achievements')}</h2>
      <div className="grid grid-cols-2 gap-3">{ACHS.map(a=>{const v=Math.min(a[3],prog(a));const ok=v>=a[3];return <div key={a[0]} className={'rounded-xl p-3 border '+(ok?'border-green-400/40 bg-green-500/10':'border-white/10 bg-white/5')}>
        <p className={'text-sm font-semibold '+(ok?'text-green-300':'text-white')}>{tr(a[0])}</p><div className="h-1.5 rounded-full bg-white/10 mt-2 overflow-hidden"><div className="h-full rounded-full" style={{width:(v/a[3]*100)+'%',background:ok?'#22c55e':'linear-gradient(90deg,#3b82f6,#22d3ee)'}}/></div><p className="text-[10px] text-slate-500 mt-1">{v}/{a[3]}</p></div>})}</div></div>
  </div>;
}
function DailyPick({onOpen,cfg}){
  const [s,setS]=useState(null);const [got,setGot]=useState(()=>store.get('nx_pick_day','')===todayStr());
  const mode=(cfg&&cfg.mode)||'free';
  useEffect(()=>{let dead=false;api('/api/fetch?page=1&mode='+mode+'&sortBy=views&order=desc&max=20',undefined,{immediate:true}).then(d=>{const l=pick(d).list;if(!dead&&l.length)setS(l[dayNum()%l.length])}).catch(()=>{});return()=>{dead=true}},[mode]);
  if(!s)return null;
  const open=()=>{if(!got){store.set('nx_pick_day',todayStr());setGot(true);bumpXp(5)}onOpen(s)};
  return <button onClick={open} aria-label={s.title} className="w-full text-left mb-5 glass rounded-2xl p-3 flex gap-3 items-center glow-card">
    <span className="shrink-0 rounded-xl overflow-hidden" style={{width:112}}><Thumb s={s} sm/></span>
    <span className="min-w-0 flex-1 block"><span className="text-[11px] font-semibold text-amber-300 flex items-center gap-1"><Ic n="star" s={12} fill/>{tr('Script of the day')}{!got&&<span className="ml-1 text-green-300">+5 XP</span>}</span>
      <span className="block text-sm font-semibold text-white line-clamp-2">{s.title}</span><span className="block text-xs text-slate-400 line-clamp-1">{s.game&&s.game.name}</span></span></button>;
}
function BottomNav({view,go,onMenu}){
  const items=[['home','Home','home'],['feed','Feed','play'],['videos','Shorts','video'],['chat','Chat','chat'],['rewards','Rewards','trophy']];
  return <nav aria-label="Main" className="md:hidden fixed bottom-0 inset-x-0 z-30 flex items-stretch justify-around border-t border-white/10" style={{background:'rgba(8,12,40,.96)',paddingBottom:'env(safe-area-inset-bottom,0px)'}}>
    {items.map(it=><button key={it[0]} onClick={()=>go(it[0])} aria-label={tr(it[1])} className={'flex-1 flex flex-col items-center gap-0.5 py-2 text-[10px] '+(view===it[0]?'text-blue-300':'text-slate-400')}><Ic n={it[2]} s={20}/>{tr(it[1])}</button>)}
    <button onClick={onMenu} aria-label="Menu" className="flex-1 flex flex-col items-center gap-0.5 py-2 text-[10px] text-slate-400"><Ic n="menu" s={20}/>{tr('Menu')}</button></nav>;
}

function WalletPage({user,profile,acct,refresh,go,toast}){

  const uid=user&&user.id;
  const loadLists=useCallback(async()=>{

    setOrders(o.data||[]);
    const t=await sb.from('wallet_tx').select('id,delta,kind,note,created_at').eq('user_id',uid).order('id',{ascending:false}).limit(8);

  },[uid]);

  },[uid,refresh,loadLists]);

    setCur(data);loadLists();
  };

    if(!cur)return;
    const {error}=await sb.rpc('claim_paid',{p_order_id:cur.id,p_note:note.trim()});
    if(error){log('claim error',error);toast(tr('Could not send. Try again.'));return}
    toast(tr('Thanks! We will check your payment soon.'),'ok');setCur(null);setPack(null);loadLists();
  };

// Owner and developers: confirm top-ups and review uploaded scripts
function ReviewPage({toast}){
  const [tab,setTab]=useState('topups');const [orders,setOrders]=useState([]);const [scripts,setScripts]=useState([]);const [names,setNames]=useState({});const [open,setOpen]=useState(null);
  const load=useCallback(async()=>{
    if(!sb)return;
    const o=await sb.from('topup_orders').select('id,user_id,monux,amount_idr,method,sender_name,paid_note,claimed_paid,created_at').eq('status','pending').order('created_at',{ascending:true}).limit(50);
    const scq=cols=>sb.from('user_scripts').select(cols).eq('status','pending').order('created_at',{ascending:true}).limit(30);
    let sc=await scq('id,user_id,name,info,description,author,script,created_at,flags');if(sc.error)sc=await scq('id,user_id,name,info,description,author,script,created_at');
    const od=(o.data||[]).slice().sort((a,b)=>(b.claimed_paid?1:0)-(a.claimed_paid?1:0));
    const ids=Array.from(new Set(od.map(x=>x.user_id).concat((sc.data||[]).map(x=>x.user_id))));
    if(ids.length){const pr=await sb.from('profiles').select('user_id,username').in('user_id',ids);const m={};(pr.data||[]).forEach(r=>{m[r.user_id]=r.username});setNames(m)}
    setOrders(od);setScripts(sc.data||[]);
  },[]);
  useEffect(()=>{load()},[load]);
  const decide=async(id,ok)=>{
    if(ok&&!window.confirm(tr('Did the money arrive? Approve this top-up?')))return;
    const {error}=await sb.rpc('approve_topup',{order_id:id,approve:ok});
    if(error){log('approve error',error);toast(error.message||tr('Something went wrong.'));return}
    toast(ok?tr('Approved.'):tr('Rejected.'),'ok');load();
  };
  const setStatus=async(id,status)=>{const {error}=await sb.from('user_scripts').update({status}).eq('id',id);if(error){toast(tr('Something went wrong.'));return}toast(status==='approved'?tr('Approved.'):tr('Rejected.'),'ok');load()};
  const delScript=async id=>{if(!window.confirm(tr('Delete this script?')))return;const {error}=await sb.from('user_scripts').delete().eq('id',id);if(error){toast(tr('Something went wrong.'));return}load()};
  const ageH=d=>Math.floor((Date.now()-new Date(d))/36e5);
  return <div className="page space-y-4">
    <Seg label="Review" value={tab} opts={[['topups','Top-ups ('+orders.length+')'],['scripts','Scripts ('+scripts.length+')']]} onChange={setTab}/>
    {tab==='topups'&&(orders.length===0?<Empty t="Nothing to review" d="New top-ups and scripts show up here."/>
      :<div className="space-y-3">{orders.map(o=><div key={o.id} className={'glass rounded-2xl p-4 space-y-2 '+(o.claimed_paid?'border-green-400/40':'')}>
        <div className="flex items-center justify-between gap-2"><p className="text-white font-semibold">{names[o.user_id]||'?'} - {MX} {o.monux}</p>{o.claimed_paid&&<span className="text-[10px] px-2 py-0.5 rounded-full border border-green-400/40 text-green-300">{tr('says paid')}</span>}</div>
        <p className="text-sm text-slate-300">{rp(o.amount_idr)} - {o.method} - {tr('code')} {o.id.slice(0,6).toUpperCase()}</p>
        <p className="text-xs text-slate-400">{tr('Name on payment')}: {o.sender_name}{o.paid_note?' - '+o.paid_note:''} - {ageH(o.created_at)}h {ageH(o.created_at)>=24?'('+tr('expired')+')':''}</p>
        <div className="flex gap-2"><button onClick={()=>decide(o.id,true)} className="flex-1 py-2 rounded-lg text-sm font-semibold bg-green-500/20 border border-green-400/40 text-green-200">{tr('Approve')}</button><button onClick={()=>decide(o.id,false)} className="flex-1 py-2 rounded-lg text-sm font-semibold bg-red-500/20 border border-red-400/40 text-red-200">{tr('Reject')}</button></div></div>)}</div>)}
    {tab==='scripts'&&(scripts.length===0?<Empty t="Nothing to review" d="New top-ups and scripts show up here."/>
      :<div className="space-y-3">{scripts.map(x=><div key={x.id} className="glass rounded-2xl p-4 space-y-2">
        <p className="text-white font-semibold">{x.name}</p>{x.flags&&<p className="text-xs font-semibold text-red-300">{tr('Warning')}: {x.flags} ({tr('may steal accounts or data')})</p>}<p className="text-xs text-slate-400">{x.info} - {names[x.user_id]||x.author}</p>
        {x.description&&<p className="text-sm text-slate-300 whitespace-pre-wrap break-words">{x.description}</p>}
        <button onClick={()=>setOpen(open===x.id?null:x.id)} className="text-xs text-blue-300">{open===x.id?tr('Hide code'):tr('Show code')}</button>
        {open===x.id&&<pre className="text-[11px] p-3 rounded-lg bg-black/40 overflow-auto max-h-60 break-all whitespace-pre-wrap">{x.script.slice(0,4000)}</pre>}
        <div className="flex gap-2"><button onClick={()=>setStatus(x.id,'approved')} className="flex-1 py-2 rounded-lg text-sm font-semibold bg-green-500/20 border border-green-400/40 text-green-200">{tr('Approve')}</button><button onClick={()=>setStatus(x.id,'rejected')} className="flex-1 py-2 rounded-lg text-sm font-semibold bg-red-500/20 border border-red-400/40 text-red-200">{tr('Reject')}</button><button onClick={()=>delScript(x.id)} className="px-4 py-2 rounded-lg glass text-sm">{tr('Delete')}</button></div></div>)}</div>)}
  </div>;
}

  const answer=(k)=>{
    if(pick!==-1||done)return;
    setPick(k);const ok=k===cur.c;const sc=score+(ok?1:0);if(ok)setScore(sc);
    setTimeout(()=>{if(i+1>=qs.length)finish(sc);else{setI(i+1);setPick(-1);setLeft(15)}},900);
  };
  useEffect(()=>{
    if(done||pick!==-1)return;
    if(left<=0){answer(-2);return}
    const t=setTimeout(()=>setLeft(l=>l-1),1000);return()=>clearTimeout(t);
  },[left,pick,done]);
  const again=()=>{setQs(QUIZ.slice().sort(()=>Math.random()-.5).slice(0,10).map(q=>{const idx=q.o.map((_,j)=>j).sort(()=>Math.random()-.5);return{q:q.q,o:idx.map(j=>q.o[j]),c:idx.indexOf(q.c)}}));setI(0);setPick(-1);setScore(0);setLeft(15);setDone(false);setGain(0)};
  if(done)return <div className="page glass rounded-2xl p-8 text-center glow-card space-y-3">
    <p className="hd text-4xl text-white">{score}/{qs.length}</p>
    <p className="text-slate-300">{score>=9?tr('Legendary!'):score>=7?tr('Great job!'):score>=5?tr('Not bad!'):tr('Keep practicing!')}</p>
    <p className="text-green-300 font-semibold">{gain>0?'+'+gain+' XP':tr('Daily quiz XP limit reached. Come back tomorrow!')}</p>
    <button onClick={again} className="px-8 py-3 rounded-xl font-semibold text-white" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>{tr('Play again')}</button></div>;
  return <div className="page glass rounded-2xl p-5 space-y-4">
    <div className="flex items-center justify-between text-xs text-slate-400"><span>{tr('Question')} {i+1}/{qs.length}</span><span>{tr('Score')}: {score}</span><span className={left<=5?'text-red-300':''}>{left}s</span></div>
    <div className="h-1.5 rounded-full bg-white/10 overflow-hidden"><div className="h-full rounded-full" style={{width:(left/15*100)+'%',background:left<=5?'#ef4444':'linear-gradient(90deg,#3b82f6,#22d3ee)',transition:'width 1s linear'}}/></div>
    <h2 className="hd text-xl text-white">{cur.q[lang]}</h2>
    <div className="grid gap-2">{cur.o.map((o,k)=>{const show=pick!==-1;const good=k===cur.c;return <button key={k} onClick={()=>answer(k)} disabled={pick!==-1} className={'text-left px-4 py-3 rounded-xl border text-sm '+(show?(good?'border-green-400 bg-green-500/20 text-white':(k===pick?'border-red-400 bg-red-500/20 text-white':'border-white/10 bg-white/5 text-slate-400')):'border-white/10 bg-white/5 text-slate-200 hover:border-blue-400')}>{o[lang]}</button>})}</div>
    <p className="text-[11px] text-slate-500">{tr('10 XP per correct answer, up to 60 XP a day.')}</p></div>;
}

          <span className="shrink-0 w-px bg-white/10 mx-1"/>{FILTERS.map(([id,l])=><button key={id} onClick={()=>setFilter(id)} className={'shrink-0 px-3.5 py-2 rounded-full text-xs '+(filter===id?'bg-cyan-400/20 border border-cyan-400 text-cyan-200':'glass text-slate-400')}>{tr(l)}</button>)}</div>}
      </div>
      <div className="flex justify-center gap-6 px-3 md:px-5"><div className="w-full max-w-3xl min-w-0 py-3 md:py-5">
        {!detail&&BANNERS[view]&&<Banner title={BANNERS[view][0]} sub={BANNERS[view][1]} hue={BANNERS[view][2]}/>}
        {detail?<Detail key={detail.slug} s={detail} favs={favs} onFav={onFav} toast={toast} votes={votes} onVote={onVote} user={user} back={x=>x&&x.slug?setDetail(x):setDetail(null)}/>
        :view==='quiz'?<QuizPage toast={toast}/>:view==='wallet'?<WalletPage user={user} profile={profile} acct={acct} refresh={refreshAcct} go={go} toast={toast}/>:view==='review'?((profile&&(profile.role==='owner'||profile.role==='developer'))?<ReviewPage toast={toast}/>:<Empty t="Not allowed" d="Only the owner and developers can open this page."/>):view==='rewards'?<RewardsPage toast={toast} profile={profile}/>:view==='settings'?<SettingsPage cfg={cfg} setCfg={setCfg} resetCfg={resetCfg} lang={lang} changeLang={changeLang} user={user} profile={profile} onProfile={setProfile} onAvatar={()=>setShowAvatar(true)} onLogout={()=>sb&&sb.auth.signOut()} favs={favs} onClearFavs={clearFavs} onClearRecent={clearRecent} onImport={importFavs} toast={toast}/>:view==='about'?<About/>:view==='donate'?<Donate/>:view==='admin'?<Admin/>:view==='auth'?<AuthPage key={authTab} user={user} go={go} initialTab={authTab}/>:view==='videos'?<ShortsFeed toast={toast} go={go}/>:view==='feed'?<FeedPage favs={favs} onFav={onFav} onOpen={s=>{setDetail(s);window.scrollTo(0,0)}} votes={votes} onVote={onVote} toast={toast}/>:view==='games'?<GamesPage onPick={n=>{setQ(n);go('home')}}/>:view==='guide'?<GuidePage/>:view==='legal'?<LegalPage/>:view==='chat'?<ChatPage user={user} profile={profile} go={go} toast={toast}/>:view==='upload'?<UploadPage user={user} go={go} toast={toast}/>:view==='community'?<Community favs={favs} onFav={onFav} onOpen={s=>{setDetail(s);window.scrollTo(0,0)}} toast={toast}/>
        :<div className="page">{view==='home'&&!dq&&<div className="sheen relative overflow-hidden rounded-2xl mb-6 glass p-8 md:p-10 min-h-[190px]"><HeroArt/><div className="absolute inset-0 bg-gradient-to-r from-[#0a0f2c]/85 via-[#0a0f2c]/40 to-transparent"/><div className="relative"><h1 className="hd text-3xl md:text-4xl font-bold text-white">{tr("Discover")} <span className="gradtext">{tr("Roblox scripts")}</span> {tr("instantly")}</h1><p className="text-slate-300 mt-2">{tr("Browse thousands of free scripts. Fast, clean, ad-supported.")}</p></div></div>}
          {view==='home'&&!dq&&<DailyPick cfg={cfg} onOpen={s=>{setDetail(s);window.scrollTo(0,0)}}/>}
          {view==='home'&&!dq&&recent.length>0&&<RecentStrip items={recent} onOpen={s=>{setDetail(s);window.scrollTo(0,0)}}/>}
          <Grid cfg={cfg} mode={mode} query={dq} filter={filter} favs={favs} onFav={onFav} onOpen={s=>{setDetail(s);window.scrollTo(0,0)}} toast={toast}/></div>}
        <div className="mt-8 flex justify-center"><AdSlot kind="wide" label="bottom"/></div>
      </div>
      <div className="hidden xl:block w-40 shrink-0 sticky top-40 self-start pt-5" aria-label="Advertisement"><AdSlot kind="160x600" label="side rail"/></div>
      </div>
      <footer className="border-t border-white/10 p-6 text-sm text-slate-400"><div className="grid md:grid-cols-3 gap-6 max-w-5xl mx-auto">
        <div><h4 className="text-white mb-1">{tr("About")}</h4>{tr("NexScript is a free Roblox script discovery tool.")}</div>
        <div><h4 className="text-white mb-1">{tr("Links")}</h4><a className="block hover:text-white" href="https://www.youtube.com/@This-IsBacon" target="_blank" rel="noopener noreferrer">YouTube</a><a className="block hover:text-white" href="https://github.com/SCRIPTERcrazy-web" target="_blank" rel="noopener noreferrer">GitHub</a></div>
        <div><h4 className="text-white mb-1">{tr("Donate")}</h4><a className="hover:text-white" href="https://saweria.co/MyMoneyScript" target="_blank" rel="noopener noreferrer">{tr("Buy Me a Coffee")}</a></div></div>
        <p className="text-center mt-6">{tr("(c) 2026 NexScript. Powered by ScriptBlox. Not affiliated with Roblox.")}</p></footer>
    </main>
    <Confetti k={burst}/>
    <BottomNav view={view} go={go} onMenu={()=>setOpen(true)}/>
    <ScrollTop/>
    <MusicPlayer kick={musicKick} toast={toast}/>
    {authReady&&!user&&!introSeen&&<Intro lang={lang} onLang={changeLang} onChoice={introDone}/>}
    {user&&profile&&showAvatar&&<AvatarModal user={user} profile={profile} onSaved={q=>setProfile(q)} onClose={()=>setShowAvatar(false)}/>}
    {user&&profileState==='missing'&&<UsernameModal user={user} onSaved={p=>{setProfile(p);setProfileState('ready')}}/>}
    <div className="fixed top-4 right-4 z-[70] space-y-2 pointer-events-none" aria-live="polite">{toasts.map(t=><div key={t.id} className={'toast glass rounded-lg px-4 py-3 text-sm pointer-events-auto '+(t.k==='ok'?'bg-green-500/20 border-green-400/40':'bg-red-500/20 border-red-400/40')}>{t.m}</div>)}</div>
  </div>;
}
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null}}
  static getDerivedStateFromError(e){return {err:e}}
  componentDidCatch(e,info){try{console.error('NexScript error',e,info)}catch(x){}}
  render(){
    if(!this.state.err)return this.props.children;
    return <div style={{padding:24,color:'#fff',fontFamily:'sans-serif'}}><h2 style={{fontSize:20,marginBottom:8}}>Something went wrong</h2>
      <p style={{color:'#94a3b8',marginBottom:12}}>Please reload the page. If it keeps happening, send a screenshot of this message.</p>
      <pre style={{whiteSpace:'pre-wrap',fontSize:12,color:'#fca5a5'}}>{String((this.state.err&&this.state.err.message)||this.state.err)}</pre>
      <button onClick={()=>location.reload()} style={{marginTop:12,padding:'10px 18px',borderRadius:10,background:'#3b82f6',color:'#fff'}}>Reload</button></div>;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
