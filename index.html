function Grid({mode,query,filter,favs,onFav,onOpen,toast}){
  const [items,setItems]=useState([]);const [more,setMore]=useState(mode!=='fav');const [loading,setLoading]=useState(false);
  const seen=useRef(new Set());const sent=useRef();const busy=useRef(false);const pageRef=useRef(1);const moreRef=useRef(mode!=='fav');const ac=useRef();
  const key=[mode,query,filter].join('|');const keyRef=useRef(key);

  const url=useCallback(p=>{
    if(mode==='fav')return null;

    // ===== SEARCH =====
    if(query){
      const f={verified:'&verified=1',keyless:'&keyless=1',universal:'&universal=1',nokey:'&key=0',all:''}[filter]||'';
      return `/api/search?q=${encodeURIComponent(query)}&page=${p}${f}`;
    }

    // ===== MODE SORT: pakai endpoint khusus =====
    if(mode==='trending'&&p===1) return '/api/trending';
    if(mode==='newest')          return '/api/newest?pages=3';
    if(mode==='views')           return '/api/views?pages=3';
    if(mode==='rated')           return '/api/rated?pages=3';

    // ===== MODE FILTER =====
    if(mode==='verified') return '/api/filter?filter=verified&sort=views&pages=3';
    if(mode==='keyless')  return '/api/filter?filter=keyless&sort=views&pages=3';

    // ===== HOME + filter pills =====
    const filterMap={all:'all',verified:'verified',keyless:'keyless',universal:'universal',nokey:'nokey'};
    const f=filterMap[filter]||'all';
    if(f!=='all') return `/api/filter?filter=${f}&sort=trending&pages=3`;

    // ===== DEFAULT =====
    return `/api/fetch?page=${p}&mode=free`;
  },[mode,query,filter]);

  useEffect(()=>{
    keyRef.current=key;if(ac.current)ac.current.abort();
    seen.current=new Set();pageRef.current=1;moreRef.current=mode!=='fav';busy.current=false;
    setItems([]);setMore(moreRef.current);setLoading(false);
    return()=>{if(ac.current)ac.current.abort()};
  },[key]);

  const load=useCallback(async()=>{
    if(busy.current||!moreRef.current)return;
    const u=url(pageRef.current);if(!u)return;
    const myKey=keyRef.current;
    busy.current=true;setLoading(true);ac.current=new AbortController();
    try{
      const d=await api(u,ac.current.signal,{immediate:pageRef.current===1});
      if(myKey!==keyRef.current)return;
      const r=d.result||d;const list=r.scripts||[];
      const fresh=list.filter(x=>{const k=x._id||x.slug;if(seen.current.has(k))return false;seen.current.add(k);return true});
      setItems(p=>[...p,...fresh]);

      const isOneShot = !query && ['newest','views','rated','verified','keyless'].includes(mode);
      const isFilterPill = !query && filter!=='all';
      if(mode==='trending'&&pageRef.current===1){
        moreRef.current=false;setMore(false);
      } else if(isOneShot||isFilterPill){
        moreRef.current=false;setMore(false);
      } else {
        const np=r.nextPage;
        if(np)pageRef.current=np;
        moreRef.current=!!np&&list.length>0;setMore(moreRef.current);
      }
      log('loaded',u,list.length,'items');
    }catch(e){
      if(e.name!=='AbortError'&&myKey===keyRef.current){toast(e.message==='Rate limited'?tr("Rate limited. Try again shortly."):tr("Failed to load scripts."));moreRef.current=false;setMore(false)}
    }finally{
      if(myKey===keyRef.current){busy.current=false;setLoading(false)}
    }
  },[url,mode,query,filter,toast]);

  useEffect(()=>{const el=sent.current;if(!el)return;const o=new IntersectionObserver(e=>e[0].isIntersecting&&load(),{rootMargin:'300px'});o.observe(el);return()=>o.disconnect()},[load]);

  const list=mode==='fav'?favs:items;
  if(mode==='fav'&&!list.length)return <Empty t="No favorites yet" d="Tap the heart on any script to save it here."/>;
  if(!loading&&!more&&!list.length)return <Empty t="No scripts found" d="Try a different keyword like 'blox fruits' or 'universal'."/>;
  const out=[];list.forEach((s,i)=>{out.push(<Card key={s._id||s.slug} i={i} s={s} fav={favs.some(f=>(f._id||f.slug)===(s._id||s.slug))} onFav={onFav} onOpen={onOpen}/>);
    if((i+1)%6===0)out.push(<div key={'ad'+i} className="col-span-full"><AdSlot kind="wide" label="in-grid"/></div>)});
  return <div><div className="grid grid-cols-2 gap-3 md:gap-4">{out}{loading&&Array.from({length:4}).map((_,i)=><Skel key={'s'+i}/>)}</div>
    <div ref={sent} className="h-10"/>
    <p className="text-center text-sm text-slate-400 py-4" role="status">{loading?tr("Loading more scripts..."):(!more&&list.length?tr("You've reached the end"):'')}</p></div>;
  }
  const Empty=({t,d})=><div className="glass rounded-2xl p-12 text-center"><svg className="mx-auto mb-4" width="96" height="96" viewBox="0 0 96 96" fill="none" aria-hidden="true"><circle cx="48" cy="48" r="40" fill="#3b82f6" opacity=".12"/><circle cx="42" cy="42" r="17" stroke="#60a5fa" strokeWidth="4"/><path d="M55 55l17 17" stroke="#22d3ee" strokeWidth="5" strokeLinecap="round"/><circle cx="72" cy="24" r="3" fill="#8b5cf6"/><circle cx="22" cy="70" r="2.5" fill="#22d3ee"/><circle cx="76" cy="62" r="2" fill="#60a5fa"/></svg><h3 className="hd text-xl text-white mb-2">{tr(t)}</h3><p className="text-slate-400">{tr(d)}</p></div>;

function Rating({slug,user,toast}){
  const [st,setSt]=useState({avg:0,count:0});const [mine,setMine]=useState(0);const [hover,setHover]=useState(0);
  const uid=user&&user.id;
  const load=useCallback(async()=>{
    if(!sb)return;
    const a=await sb.from('rating_stats').select('avg_rating,rating_count').eq('slug',slug).maybeSingle();
    setSt(a.data?{avg:Number(a.data.avg_rating),count:a.data.rating_count}:{avg:0,count:0});
    if(uid){const m=await sb.from('ratings').select('rating').eq('slug',slug).eq('user_id',uid).maybeSingle();setMine(m.data?m.data.rating:0)}else setMine(0);
  },[slug,uid]);
  useEffect(()=>{load()},[load]);
  const rate=async n=>{
    if(!user){toast(tr("Log in to rate this script."));return}
    const prev=mine;setMine(n);
    const {error}=await sb.from('ratings').upsert({user_id:user.id,slug,rating:n});
    if(error){log('rating error',error);setMine(prev);toast(tr("Could not save rating."))}else{bumpXp(3);load()}
  };
  const shown=hover||mine;
  return <div className="flex items-center gap-2 flex-wrap"><div className="flex" onMouseLeave={()=>setHover(0)}>{[1,2,3,4,5].map(n=>
    <button key={n} type="button" onClick={()=>rate(n)} onMouseEnter={()=>setHover(n)} aria-label={'Rate '+n+' stars'} className={'px-1.5 py-1 text-2xl leading-none '+(n<=shown?'text-amber-400':'text-slate-600')}><Ic n="star" s={22} fill/></button>)}</div>
    <span className="text-sm text-slate-400">{st.count?st.avg.toFixed(1)+' ('+st.count+' rating'+(st.count>1?'s':'')+')':tr("No ratings yet")}</span></div>;
}

function Detail({s,back,favs,onFav,toast,votes,onVote,user}){
  const [full,setFull]=useState(s);const [copied,setCopied]=useState(false);const [rel,setRel]=useState([]);
  useEffect(()=>{
    if(s.isUser){
      if(!sb)return;
      sb.from('user_scripts').select('script,description,author').eq('id',s.uid).maybeSingle().then(({data})=>{if(data)setFull(p=>({...p,script:data.script,description:data.description,author:data.author||'Anonymous'}))});
      return;
    }
    const ac=new AbortController();
    api('/api/script?slug='+s.slug,ac.signal,{immediate:true}).then(d=>{const x=(d.result&&(d.result.script||d.result))||{};setFull(p=>({...p,...x}))}).catch(()=>{});
    api('/api/search?q='+encodeURIComponent((s.game&&s.game.name)||s.title)+'&page=1',ac.signal).then(d=>setRel(((d.result||{}).scripts||[]).filter(x=>x.slug!==s.slug).slice(0,4))).catch(()=>{});
    return()=>ac.abort()},[s.slug]);
  const code=typeof full.script==='string'?full.script:'-- Loading script...';
  const copy=async()=>{try{await navigator.clipboard.writeText(code);bumpXp(2);setCopied(true);setTimeout(()=>setCopied(false),2000)}catch{toast(tr("Copy failed"))}};
  const vote=(votes&&votes[s.slug])||0;const v=n=>onVote(s.slug,n);
  const hl=useMemo(()=>code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/(--[^\n]*)|("[^"\n]*"|'[^'\n]*')|\b(local|function|end|if|then|else|elseif|for|while|do|return|true|false|nil|and|or|not|in)\b|\b(\d+)\b/g,(m,c,s2,k,n)=>c?`<span style="color:#64748b">${c}</span>`:s2?`<span style="color:#86efac">${s2}</span>`:k?`<span style="color:#60a5fa">${k}</span>`:`<span style="color:#fbbf24">${n}</span>`),[code]);
  return <div className="page space-y-5">
    <button onClick={back} aria-label="Go back" className="flex items-center gap-1 text-blue-300 hover:text-white"><Ic n="back"/>{tr("Back")}</button>
    <div className="glass rounded-2xl overflow-hidden glow-card"><Thumb s={full}/>
      <div className="p-5 space-y-3"><div className="flex justify-between gap-3"><h1 className="hd text-2xl font-bold text-white">{full.title}</h1>
        <button aria-label="Bookmark" onClick={()=>onFav(full)} className={favs.some(f=>f.slug===full.slug)?'text-red-400':'text-slate-400'}><Ic n="heart" s={24} fill={favs.some(f=>f.slug===full.slug)}/></button></div>
        <p className="text-slate-400 text-sm">{full.game&&full.game.name}{full.owner&&full.owner.username?' - by '+full.owner.username:''}{full.isUser&&full.author?' - by '+full.author:''}</p>
        <Badges s={full}/>
        {full.isUser&&full.description&&<p className="text-sm text-slate-300 whitespace-pre-wrap break-words">{full.description}</p>}
        <div className="flex flex-wrap gap-5 text-sm text-slate-300"><span><Ic n="eye" s={12}/> {fmt(full.views)}</span><span className="inline-flex items-center gap-1"><Ic n="play" s={11} fill/>{fmt(full.executes)}</span><span>{ago(full.createdAt)}</span></div>
        <Rating slug={s.slug} user={user} toast={toast}/>
        <div className="flex gap-2"><button aria-label="Like" onClick={()=>v(1)} className={'px-4 py-2 rounded-lg border '+(vote===1?'bg-green-500/20 border-green-400':'border-white/10')}><Ic n="thumb" s={14}/> {fmt((full.likeCount||0)+(vote===1?1:0))}</button>
          <button aria-label="Dislike" onClick={()=>v(-1)} className={'px-4 py-2 rounded-lg border '+(vote===-1?'bg-red-500/20 border-red-400':'border-white/10')}><Ic n="thumbd" s={14}/> {fmt((full.dislikeCount||0)+(vote===-1?1:0))}</button></div>
      </div></div>
    <AdSlot kind="wide" label="above code"/>
    <div className="glass rounded-2xl p-4"><div className="flex justify-between items-center mb-3"><span className="text-sm text-slate-400">{tr("Lua script")}</span>
      <button onClick={copy} aria-label="Copy script" className="px-4 py-2 rounded-lg text-sm font-semibold text-white flex items-center gap-2" style={{background:'linear-gradient(135deg,#3b82f6,#60a5fa)'}}><Ic n="copy" s={16}/>{copied?tr("Copied!"):tr("Copy Script")}</button></div>
      <pre className="overflow-auto max-h-[480px] text-xs leading-relaxed p-4 rounded-xl bg-black/40" dangerouslySetInnerHTML={{__html:hl}}/></div>
    {rel.length>0&&<div><h2 className="hd text-lg text-white mb-3">{tr("Related scripts")}</h2><div className="grid grid-cols-2 gap-3 md:gap-4">{rel.map((r,i)=><Card key={r._id||r.slug} i={i} s={r} fav={favs.some(f=>f.slug===r.slug)} onFav={onFav} onOpen={x=>{window.scrollTo(0,0);back(x)}}/>)}</div></div>}
  </div>;
}

function Admin(){
  const [pw,setPw]=useState('');const [ok,setOk]=useState(false);const [pid,setPid]=useState(store.get('pid','3499709'));const [data,setData]=useState(null);const [err,setErr]=useState('');const [upd,setUpd]=useState('');const [busy,setBusy]=useState(false);

    setErr('');

    store.set('pid',pid);setBusy(true);

  const sum=f=>(data||[]).reduce((a,x)=>a+(+x[f]||0),0);const imp=sum('impression'),clk=sum('clicks'),rev=sum('revenue');
  const max=Math.max(1,...(data||[]).map(x=>+x.revenue||0));

    {err&&<p className="text-amber-300 text-sm">{err}</p>}
    {data&&<><div className="grid grid-cols-2 md:grid-cols-3 gap-4">{[['Impressions',fmt(imp)],['Clicks',fmt(clk)],['Revenue','$'+rev.toFixed(2)],['CTR',(imp?clk/imp*100:0).toFixed(2)+'%'],['CPM','$'+(imp?rev/imp*1000:0).toFixed(2)]].map(([a,b])=><div key={a} className="glass rounded-xl p-4"><p className="text-xs text-slate-400">{a}</p><p className="hd text-2xl text-white">{b}</p></div>)}</div>

function Captcha({onToken,nonce}){
  const ref=useRef();const id=useRef();
  useEffect(()=>{
    if(!TURNSTILE_SITEKEY)return;
    const draw=()=>{if(window.turnstile&&ref.current&&id.current===undefined)id.current=window.turnstile.render(ref.current,{sitekey:TURNSTILE_SITEKEY,theme:'dark',callback:onToken,'expired-callback':()=>onToken('')})};
    if(window.turnstile)draw();else{
      let sc=document.getElementById('turnstile-api');
      if(!sc){sc=document.createElement('script');sc.id='turnstile-api';sc.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';sc.async=true;document.head.appendChild(sc)}
      sc.addEventListener('load',draw);
    }
    return()=>{try{if(window.turnstile&&id.current!==undefined)window.turnstile.remove(id.current)}catch(e){}id.current=undefined};
  },[]);
  useEffect(()=>{if(nonce&&window.turnstile&&id.current!==undefined){try{window.turnstile.reset(id.current)}catch(e){}onToken('')}},[nonce]);
  return TURNSTILE_SITEKEY?<div ref={ref}/>:null;
}

function AuthPage({user,go,initialTab}){
  const [tab,setTab]=useState(initialTab||'login');const [email,setEmail]=useState('');const [pw,setPw]=useState('');const [pw2,setPw2]=useState('');const [uname,setUname]=useState('');
  const [busy,setBusy]=useState(false);const [msg,setMsg]=useState('');const [cap,setCap]=useState('');const [nonce,setNonce]=useState(0);
  const submit=async e=>{
    e.preventDefault();setMsg('');
    if(!sb){setMsg(tr("Auth service failed to load. Refresh the page."));return}
    if(TURNSTILE_SITEKEY&&!cap){setMsg(tr("Please complete the captcha."));return}
    if(tab==='signup'){
      if(!validUsername(uname.trim())){setMsg(tr("Username must be 3-20 letters, numbers or underscores, and cannot be reserved or inappropriate."));return}
      if(pw.length<8){setMsg(tr("Password must be at least 8 characters."));return}
      if(pw!==pw2){setMsg(tr("Passwords do not match."));return}
    }
    setBusy(true);
    const captcha=TURNSTILE_SITEKEY?{captchaToken:cap}:{};
    try{
      if(tab==='signup'){
        const {data:free}=await sb.rpc('username_available',{name:uname.trim()});
        if(free===false){setMsg(tr("That username is taken."));return}
        const {data,error}=await sb.auth.signUp({email:email.trim(),password:pw,options:{...captcha,data:{username:uname.trim()},emailRedirectTo:location.origin+location.pathname}});
        if(error)throw error;
        if(data.session)go('home');else setMsg(tr("Check your email to confirm your account, then log in."));
      }else{
        const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw,options:captcha});
        if(error)throw error;
        go('home');
      }
    }catch(err){log('auth error',err);setMsg(err.message||tr('Something went wrong.'))}
    finally{setBusy(false);setNonce(n=>n+1)}
  };
  if(user)return <div className="page glass rounded-2xl p-8 max-w-md mx-auto text-center space-y-3"><h1 className="hd text-2xl text-white">{tr("You're logged in")}</h1><p className="text-slate-300 break-all">{user.email}</p>
    <button onClick={()=>sb.auth.signOut()} className="px-5 py-2 rounded-lg glass hover:border-blue-400">{tr("Log out")}</button></div>;
  const inp="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/10 outline-none focus:border-blue-400 text-white placeholder:text-slate-500";
  return <form onSubmit={submit} className="page glass rounded-2xl p-6 md:p-8 max-w-md mx-auto space-y-4 glow-card">
    <div className="flex justify-center"><LogoMark/></div>
    <div className="grid grid-cols-2 gap-1 p-1 rounded-xl bg-white/5">{[['login','Log in'],['signup','Sign up']].map(([id,l])=>
      <button type="button" key={id} onClick={()=>{setTab(id);setMsg('')}} className={'py-2 rounded-lg text-sm font-semibold '+(tab===id?'bg-blue-500 text-white':'text-slate-400')}>{tr(l)}</button>)}</div>
    <h1 className="hd text-2xl text-white">{tab==='login'?tr("Welcome back"):tr("Create your account")}</h1>
    <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} placeholder={tr("Email")} aria-label={tr("Email")} autoComplete="email" className={inp}/>
    {tab==='signup'&&<><input value={uname} onChange={e=>setUname(e.target.value)} maxLength={20} required placeholder={tr("Username")} aria-label={tr("Username")} autoComplete="username" className={inp}/><p className="text-xs text-slate-400 -mt-2">{tr("Your username is permanent and shown in chat.")}</p></>}
    <input type="password" required value={pw} onChange={e=>setPw(e.target.value)} placeholder={tr("Password")} aria-label={tr("Password")} autoComplete={tab==='login'?'current-password':'new-password'} className={inp}/>
    {tab==='signup'&&<input type="password" required value={pw2} onChange={e=>setPw2(e.target.value)} placeholder={tr("Confirm password")} aria-label={tr("Confirm password")} autoComplete="new-password" className={inp}/>}
    <Captcha onToken={setCap} nonce={nonce}/>
    {msg&&<p className="text-amber-300 text-sm" role="alert">{msg}</p>}
    <button type="submit" disabled={busy} className="w-full py-3 rounded-lg font-semibold text-white disabled:opacity-60" style={{background:'linear-gradient(135deg,#3b82f6,#60a5fa)'}}>{busy?tr("Please wait..."):(tab==='login'?tr("Log in"):tr("Sign up"))}</button>
  </form>;
}

const toCard=r=>({_id:'u-'+r.id,slug:'u-'+r.id,uid:r.id,isUser:true,title:r.name,game:{name:r.info},description:r.description,author:r.author||'Anonymous',views:0,executes:0,likeCount:0,dislikeCount:0,createdAt:r.created_at});
function Community({favs,onFav,onOpen,toast}){
  const [items,setItems]=useState([]);const [more,setMore]=useState(!!sb);const [loading,setLoading]=useState(false);
  const pageRef=useRef(0);const busy=useRef(false);const moreRef=useRef(!!sb);const sent=useRef();
  const load=useCallback(async()=>{
    if(busy.current||!moreRef.current||!sb)return;
    busy.current=true;setLoading(true);
    const from=pageRef.current*20;
    const {data,error}=await sb.from('user_scripts').select('id,name,info,description,author,created_at').eq('status','approved').order('created_at',{ascending:false}).range(from,from+19);
    if(error){log('community error',error);toast(tr("Failed to load community scripts."));moreRef.current=false;setMore(false)}
    else{setItems(p=>[...p,...data.map(toCard)]);pageRef.current++;if(data.length<20){moreRef.current=false;setMore(false)}}
    busy.current=false;setLoading(false);
  },[toast]);
  useEffect(()=>{const el=sent.current;if(!el)return;const o=new IntersectionObserver(e=>e[0].isIntersecting&&load(),{rootMargin:'300px'});o.observe(el);return()=>o.disconnect()},[load]);
  if(!loading&&!more&&!items.length)return <Empty t="No community scripts yet" d="Be the first: log in and use Upload to share a script."/>;
  return <div><div className="grid grid-cols-2 gap-3 md:gap-4">{items.map((x,i)=><Card key={x._id} i={i} s={x} fav={favs.some(f=>f.slug===x.slug)} onFav={onFav} onOpen={onOpen}/>)}{loading&&Array.from({length:4}).map((_,i)=><Skel key={'s'+i}/>)}</div>
    <div ref={sent} className="h-10"/><p className="text-center text-sm text-slate-400 py-4" role="status">{loading?tr("Loading more scripts..."):(!more&&items.length?tr("You've reached the end"):'')}</p></div>;
}

function UploadPage({user,go,toast}){
  const [f,setF]=useState({name:'',info:'',description:'',script:'',author:''});
  const [cap,setCap]=useState('');const [nonce,setNonce]=useState(0);const [busy,setBusy]=useState(false);const [msg,setMsg]=useState('');const [ok,setOk]=useState(false);const [mine,setMine]=useState([]);
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));

  const loadMine=useCallback(async()=>{
    if(!sb||!uid)return;
    const {data}=await sb.from('user_scripts').select('id,name,status,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(20);
    setMine(data||[]);
  },[uid]);
  useEffect(()=>{loadMine()},[loadMine]);

  const submit=async e=>{
    e.preventDefault();setMsg('');setOk(false);
    if(!ADMIN_API){setMsg(tr("Upload server is not configured yet."));return}
    if(TURNSTILE_SITEKEY&&!cap){setMsg(tr("Please complete the captcha."));return}
    const name=f.name.trim(),info=f.info.trim(),script=f.script.trim();
    if(name.length<3){setMsg(tr("Script name must be at least 3 characters."));return}
    if(!info){setMsg(tr("Please fill in the information field."));return}

    setBusy(true);
    try{
      const {data:{session}}=await sb.auth.getSession();
      if(!session){setMsg(tr("Session expired. Please log in again."));return}
      const r=await fetch(ADMIN_API+'/api/submit-script',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({name,info,description:f.description.trim(),script,author:f.author.trim(),captchaToken:cap})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){setMsg(d.error||('Upload failed ('+r.status+')'));return}
      setOk(true);setMsg(tr("Submitted! Your script will appear in Community after it is reviewed."));setF(p=>({name:'',info:'',description:'',script:'',author:p.author}));loadMine();
    }catch(err){log('upload error',err);setMsg(tr("Could not reach the upload server."))}

      <textarea value={f.script} onChange={set('script')} maxLength={50000} rows={10} spellCheck={false} placeholder={tr("Paste your Lua script here")} aria-label="Script code" className={inp+' font-mono text-xs'}/>

  },[]);
  useEffect(()=>{if(profile&&profile.username){avRef.current[profile.username]=profile.avatar_url||null;setAvs(p=>({...p,[profile.username]:profile.avatar_url||null}))}},[profile]);
  useEffect(()=>{
    if(!sb)return;let dead=false;
    sb.from('chat_messages').select('id,user_id,author,role,kind,media_path,body,created_at,edited_at').order('id',{ascending:false}).limit(250).then(({data,error})=>{
      if(dead)return;if(error){log('chat load error',error);toast(tr('Could not load chat.'));return}
      setMsgs(data.slice().reverse());ensureAv(data);
    });
    const ch=sb.channel('global-chat')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},p=>{setMsgs(m=>m.some(x=>x.id===p.new.id)?m:[...m,p.new].slice(-250));ensureAv([p.new])})
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'chat_messages'},p=>{if(p.old&&p.old.id!==undefined)setMsgs(m=>m.filter(x=>x.id!==p.old.id))})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_messages'},p=>{setMsgs(m=>m.map(x=>x.id===p.new.id?{...x,...p.new}:x))})

  const mediaUrl=path=>sb.storage.from('chat-media').getPublicUrl(path).data.publicUrl;

    if(!profile){toast(tr('Choose a username first.'));return false}
    if(Date.now()-last.current<2000){toast(tr('Slow down a little.'));return false}
    last.current=Date.now();return true;
  };
  const post=async row=>{
    const {data,error}=await sb.from('chat_messages').insert({user_id:user.id,...row}).select('id,user_id,author,role,kind,media_path,body,created_at,edited_at').single();
    if(error){

      toast(m.indexOf('Inappropriate')>=0?tr('Your message contains inappropriate language.'):m.indexOf('Slow')>=0?tr('Slow down a little.'):m.indexOf('username')>=0?tr('Choose a username first.'):tr('Message not sent.'));
      return false;
    }

  };
  const sendText=async e=>{

const todayStr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const readStats=()=>store.get('nx_stats',{last:'',streak:0,xp:0});
function touchStreak(){
  const st=readStats();const t=todayStr();if(st.last===t)return st;
  st.streak=(st.last===todayStr(new Date(Date.now()-864e5)))?st.streak+1:1;st.last=t;st.xp+=5;store.set('nx_stats',st);return st;
}
function bumpXp(n){const st=readStats();st.xp+=n;store.set('nx_stats',st);try{window.dispatchEvent(new Event('nx-xp'))}catch(e){}}
const levelOf=xp=>Math.floor(Math.sqrt(xp/10))+1;
function StatsCard(){
  const [st,setSt]=useState(()=>touchStreak());
  useEffect(()=>{const h=()=>setSt(readStats());window.addEventListener('nx-xp',h);return()=>window.removeEventListener('nx-xp',h)},[]);
  const lv=levelOf(st.xp),lo=10*(lv-1)*(lv-1),hi=10*lv*lv,pct=Math.max(0,Math.min(100,Math.round((st.xp-lo)/(hi-lo)*100)));
  return <div className="glass rounded-xl p-3 text-xs"><div className="flex items-center justify-between"><span className="font-semibold text-amber-300"><Ic n="flame" s={14}/> {st.streak} {tr('day streak')}</span><span className="text-slate-300">{tr('Level')} {lv}</span></div>
    <div className="h-1.5 rounded-full bg-white/10 mt-2 overflow-hidden"><div className="h-full rounded-full" style={{width:pct+'%',background:'linear-gradient(90deg,#3b82f6,#22d3ee)',transition:'width .6s'}}/></div>
    <p className="text-[10px] text-slate-500 mt-1">{st.xp} XP</p></div>;
}

function FeedPage({favs,onFav,onOpen,votes,onVote,toast}){

      const img=abs(s.image)||abs(s.game&&s.game.imageUrl);const fav=favs.some(f=>f.slug===s.slug);const vote=(votes&&votes[s.slug])||0;
      return <section key={s._id||s.slug} className="snap-start snap-always h-full p-1"><div className="h-full rounded-2xl overflow-hidden flex flex-col glass">

          <div className="absolute bottom-3 left-4 right-4"><p className="text-xs text-blue-200 truncate">{s.game&&s.game.name}</p><h2 className="hd text-xl md:text-2xl font-bold text-white line-clamp-3">{s.title}</h2>
            <p className="text-xs text-slate-300 mt-1"><Ic n="thumb" s={14}/> {fmt((s.likeCount||0)+(vote===1?1:0))} - <Ic n="play" s={11} fill/> {fmt(s.executes)} - {ago(s.createdAt)}</p></div>

          <button onClick={()=>onFav(s)} aria-label="Bookmark" className={ab+' '+(fav?'text-red-400':'')}><Ic n="heart" s={18} fill={fav}/></button>

const Music=(()=>{

      <div className="mt-auto pt-3 space-y-2"><p className="text-[11px] text-slate-400 flex items-center gap-1.5"><i className="w-2 h-2 rounded-full bg-green-400 a-blink"/>{online} {tr('online')}</p><StatsCard/></div>
      <div className="mt-3 pt-3 border-t border-white/10">
        {user?<div className="text-xs text-slate-300"><div className="flex items-center gap-2 mb-2 min-w-0">{profile&&<button onClick={()=>setShowAvatar(true)} aria-label="Change profile picture" className="shrink-0 rounded-full"><Avatar name={profile.username} role={profile.role} url={profile.avatar_url} size={34}/></button>}<div className="min-w-0"><p className={'truncate font-semibold '+(profile&&profile.role==='owner'?'owner-name':'text-white')} title={user.email}>{profile?profile.username:user.email}</p><RoleBadge role={profile&&profile.role}/></div></div><button onClick={()=>sb.auth.signOut()} aria-label={tr("Log out")} className="w-full px-3 py-2 rounded-lg glass hover:border-blue-400 text-sm">{tr("Log out")}</button></div>
        :<button onClick={()=>{setAuthTab('login');go('auth')}} aria-label="Log in or sign up" className="w-full px-3 py-2 rounded-lg text-sm font-semibold text-white" style={{background:'linear-gradient(135deg,#3b82f6,#60a5fa)'}}>{tr("Log in / Sign up")}</button>}</div>
      <div className="mt-3 pt-1 text-xs text-slate-500"><button onClick={()=>go('about')} className="flex items-center gap-2 text-slate-300 mb-2"><img src={OWNER_IMG} alt="" className="w-8 h-8 rounded-full object-cover"/>ThisIsBacon - {tr("View Profile")}</button>{tr("Powered by ScriptBlox")}</div>
    </aside>
    <main className="flex-1 min-w-0 md:ml-60">
      <div className="sticky top-0 z-20 p-4 space-y-3" style={{background:'rgba(10,15,44,.85)',backdropFilter:'blur(12px)'}}>
        <div className="flex items-center gap-3"><button className="md:hidden text-white p-2 -ml-2" aria-label="Open menu" onClick={()=>setOpen(true)}><Ic n="menu" s={24}/></button>
          <div className="relative flex-1"><span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"><Ic n="search"/></span>
            <input value={q} onChange={e=>{setQ(e.target.value);if(!grid)go('home')}} aria-label={tr("Search scripts")} placeholder={tr("Search scripts, games, or creators...")} className="w-full h-12 rounded-full bg-white text-slate-900 pl-12 pr-12 outline-none focus:ring-2 focus:ring-blue-500 focus:shadow-[0_0_20px_rgba(59,130,246,0.3)] placeholder:text-slate-500"/>
            {q&&<button aria-label="Clear search" onClick={()=>setQ('')} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-500 p-2"><Ic n="x"/></button>}</div>
          <button onClick={()=>changeLang(lang==='en'?'id':'en')} aria-label="Change language" className="shrink-0 h-12 px-3 rounded-full glass text-sm font-semibold text-white"><span className={lang==='en'?'text-blue-300':'text-slate-500'}>EN</span>/<span className={lang==='id'?'text-blue-300':'text-slate-500'}>ID</span></button></div>
        {grid&&!detail&&<div className="flex flex-wrap gap-2">{SORTS.map(([id,l])=><button key={id} onClick={()=>go(id)} className={'px-4 py-2 rounded-full text-sm '+(view===id?'bg-blue-500 text-white':'glass text-slate-300')}>{tr(l)}</button>)}
          <span className="w-px bg-white/10 mx-1"/>{FILTERS.map(([id,l])=><button key={id} onClick={()=>setFilter(id)} className={'px-3.5 py-2 rounded-full text-xs '+(filter===id?'bg-cyan-400/20 border border-cyan-400 text-cyan-200':'glass text-slate-400')}>{tr(l)}</button>)}</div>}
      </div>
      <div className="flex justify-center gap-6 px-3 md:px-5"><div className="w-full max-w-3xl min-w-0 py-3 md:py-5">
        {!detail&&BANNERS[view]&&<Banner title={BANNERS[view][0]} sub={BANNERS[view][1]} hue={BANNERS[view][2]}/>}
        {detail?<Detail key={detail.slug} s={detail} favs={favs} onFav={onFav} toast={toast} votes={votes} onVote={onVote} user={user} back={x=>x&&x.slug?setDetail(x):setDetail(null)}/>
        :view==='about'?<About/>:view==='donate'?<Donate/>:view==='admin'?<Admin/>:view==='auth'?<AuthPage key={authTab} user={user} go={go} initialTab={authTab}/>:view==='videos'?<ShortsFeed toast={toast}/>:view==='feed'?<FeedPage favs={favs} onFav={onFav} onOpen={s=>{setDetail(s);window.scrollTo(0,0)}} votes={votes} onVote={onVote} toast={toast}/>:view==='games'?<GamesPage onPick={n=>{setQ(n);go('home')}}/>:view==='guide'?<GuidePage/>:view==='legal'?<LegalPage/>:view==='chat'?<ChatPage user={user} profile={profile} go={go} toast={toast}/>:view==='upload'?<UploadPage user={user} go={go} toast={toast}/>:view==='community'?<Community favs={favs} onFav={onFav} onOpen={s=>{setDetail(s);window.scrollTo(0,0)}} toast={toast}/>
        :<div className="page">{view==='home'&&!dq&&<div className="sheen relative overflow-hidden rounded-2xl mb-6 glass p-8 md:p-10 min-h-[190px]"><HeroArt/><div className="absolute inset-0 bg-gradient-to-r from-[#0a0f2c]/85 via-[#0a0f2c]/40 to-transparent"/><div className="relative"><h1 className="hd text-3xl md:text-4xl font-bold text-white">{tr("Discover")} <span className="text-blue-400">{tr("Roblox scripts")}</span> {tr("instantly")}</h1><p className="text-slate-300 mt-2">{tr("Browse thousands of free scripts. Fast, clean, ad-supported.")}</p></div></div>}
          {view==='home'&&!dq&&recent.length>0&&<RecentStrip items={recent} onOpen={s=>{setDetail(s);window.scrollTo(0,0)}}/>}
          <Grid mode={mode} query={dq} filter={filter} favs={favs} onFav={onFav} onOpen={s=>{setDetail(s);window.scrollTo(0,0)}} toast={toast}/></div>}
        <div className="mt-8 flex justify-center"><AdSlot kind="wide" label="bottom"/></div>
      </div>
      <div className="hidden xl:block w-40 shrink-0 sticky top-40 self-start pt-5" aria-label="Advertisement"><AdSlot kind="160x600" label="side rail"/></div>
      </div>
      <footer className="border-t border-white/10 p-6 text-sm text-slate-400"><div className="grid md:grid-cols-3 gap-6 max-w-5xl mx-auto">
        <div><h4 className="text-white mb-1">{tr("About")}</h4>{tr("NexScript is a free Roblox script discovery tool.")}</div>
        <div><h4 className="text-white mb-1">{tr("Links")}</h4><a className="block hover:text-white" href="https://www.youtube.com/@This-IsBacon" target="_blank" rel="noopener noreferrer">YouTube</a><a className="block hover:text-white" href="https://github.com/SCRIPTERcrazy-web" target="_blank" rel="noopener noreferrer">GitHub</a></div>
        <div><h4 className="text-white mb-1">{tr("Donate")}</h4><a className="hover:text-white" href="https://saweria.co/MyMoneyScript" target="_blank" rel="noopener noreferrer">{tr("Buy Me a Coffee")}</a></div></div>
        <p className="text-center mt-6">{tr("(c) 2026 NexScript. Powered by ScriptBlox. Not affiliated with Roblox.")}</p></footer>
    </main>
    <MusicPlayer kick={musicKick} toast={toast}/>
    {authReady&&!user&&!introSeen&&<Intro lang={lang} onLang={changeLang} onChoice={introDone}/>}
    {user&&profile&&showAvatar&&<AvatarModal user={user} profile={profile} onSaved={q=>setProfile(q)} onClose={()=>setShowAvatar(false)}/>}
    {user&&profileState==='missing'&&<UsernameModal user={user} onSaved={p=>{setProfile(p);setProfileState('ready')}}/>}
    <div className="fixed top-4 right-4 z-[70] space-y-2" aria-live="polite">{toasts.map(t=><div key={t.id} className="toast glass rounded-lg px-4 py-3 text-sm bg-red-500/20 border-red-400/40">{t.m}</div>)}</div>
  </div>;
}
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null}}
  static getDerivedStateFromError(e){return {err:e}}
  componentDidCatch(e,info){try{console.error('NexScript error',e,info)}catch(x){}}
  render(){
    if(!this.state.err)return this.props.children;
    return <div style={{padding:24,color:'#fff',fontFamily:'sans-serif'}}><h2 style={{fontSize:20,marginBottom:8}}>Something went wrong</h2>
      <p style={{color:'#94a3b8',marginBottom:12}}>Please reload the page. If it keeps happening, send a screenshot of this message.</p>
      <pre style={{whiteSpace:'pre-wrap',fontSize:12,color:'#fca5a5'}}>{String((this.state.err&&this.state.err.message)||this.state.err)}</pre>
      <button onClick={()=>location.reload()} style={{marginTop:12,padding:'10px 18px',borderRadius:10,background:'#3b82f6',color:'#fff'}}>Reload</button></div>;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script></body></html>
