<!DOCTYPE html>
<html lang="en" data-maintenance-page>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maintenance - NexScript</title>
<meta name="description" content="NexScript is being upgraded. We will be right back.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05071a">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05071a;--ink:#e8edff;--mute:#94a3c8;--b:#3b82f6;--v:#8b5cf6;--c:#22d3ee;--p:#f472b6;--g:#34d399;--glass:rgba(14,20,58,.55);--line:rgba(148,163,255,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
h1,.hd{font-family:"Space Grotesk",Inter,system-ui,sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}


.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#141b5c 0%,#080c2e 45%,#05071a 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform;animation:drift 20s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle,#3b82f6,transparent 65%)}
.b2{width:40vmax;height:40vmax;right:-10vmax;bottom:-12vmax;background:radial-gradient(circle,#8b5cf6,transparent 65%);animation-delay:-7s}
.b3{width:30vmax;height:30vmax;left:38%;top:42%;background:radial-gradient(circle,#22d3ee,transparent 65%);opacity:.28;animation-delay:-13s}
@keyframes drift{to{transform:translate3d(8vmax,5vmax,0) scale(1.18)}}
.grid{position:absolute;left:-50%;right:-50%;bottom:-8%;height:62%;background-image:linear-gradient(rgba(120,140,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,255,.22) 1px,transparent 1px);background-size:56px 56px;transform:perspective(520px) rotateX(64deg);transform-origin:50% 100%;animation:gridmove 5s linear infinite;-webkit-mask-image:linear-gradient(to top,#000 0%,transparent 78%);mask-image:linear-gradient(to top,#000 0%,transparent 78%);opacity:.55}
@keyframes gridmove{to{background-position:0 56px,0 0}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block}
#orb{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;z-index:30;pointer-events:none;border:1.5px solid rgba(160,200,255,.7);box-shadow:0 0 22px 3px rgba(80,140,255,.45),inset 0 0 14px rgba(120,170,255,.35);opacity:0;transition:opacity .3s,width .2s,height .2s,margin .2s,border-color .2s;will-change:transform;mix-blend-mode:screen}
#orb.on{opacity:1}
#orb.down{width:56px;height:56px;margin:-28px 0 0 -28px;border-color:rgba(244,114,182,.9)}


.stage{position:relative;z-index:5;min-height:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden}
.card{
  position:relative;
  width:min(92vw,560px);
  max-height:min(88vh,760px);
  overflow-y:auto;
  padding:clamp(20px,3.5vw,34px) clamp(16px,3.5vw,32px);
  border-radius:24px;
  text-align:center;
  background:linear-gradient(160deg,rgba(24,34,98,.55),rgba(10,14,46,.62));
  border:1px solid var(--line);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.03) inset,0 0 80px -30px rgba(80,120,255,.55);
  transform-style:preserve-3d;
  will-change:transform;
  animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
  scrollbar-width:thin;
}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(120,170,255,.95),rgba(139,92,246,.45) 40%,transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(520px circle at var(--mx,50%) var(--my,0%),rgba(120,160,255,.13),transparent 60%);pointer-events:none}


.logo{position:relative;width:84px;height:84px;margin:0 auto 12px;display:grid;place-items:center}
.logo svg{width:52px;height:52px;filter:drop-shadow(0 0 16px rgba(90,150,255,.8));animation:float 5s ease-in-out infinite;cursor:pointer;pointer-events:auto}
@keyframes float{50%{transform:translateY(-5px) scale(1.04)}}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;animation:spin 2.6s linear infinite}
.r1{border-top-color:#60a5fa;border-right-color:#a78bfa}
.r2{inset:-12px;border-bottom-color:#22d3ee;border-left-color:#f472b6;animation-duration:4.4s;animation-direction:reverse}
.r3{inset:12px;border-top-color:rgba(255,255,255,.55);animation-duration:1.9s}
@keyframes spin{to{transform:rotate(360deg)}}

.chip{display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#bcd0ff;background:rgba(80,110,255,.14);border:1px solid rgba(120,150,255,.3)}
.chip i{width:8px;height:8px;border-radius:50%;background:#fbbf24;box-shadow:0 0 0 0 rgba(251,191,36,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(251,191,36,0)}100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}}
h1{margin:14px 0 8px;font-size:clamp(26px,5vw,40px);line-height:1.08;font-weight:700;letter-spacing:-.02em;background:linear-gradient(90deg,#7db3ff,#c4a6ff,#5eead4,#f9a8d4,#7db3ff);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:240% 0}}
.sub{max-width:480px;margin:0 auto;font-size:clamp(13.5px,2vw,15px);line-height:1.55;color:var(--mute)}

.eta{margin-top:18px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,1.6vw,12px);margin:10px auto 0;max-width:400px}
.unit{padding:11px 4px 9px;border-radius:14px;background:rgba(6,9,36,.55);border:1px solid var(--line)}
.num{display:block;font-family:"Space Grotesk",Inter,sans-serif;font-size:clamp(24px,5.2vw,34px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 18px rgba(110,150,255,.65)}
.num.tick{animation:tick .35s ease}
@keyframes tick{40%{transform:translateY(-3px);color:#9bd1ff}}
.lab{display:block;margin-top:6px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.soon{display:none;margin:12px 0 0;font-size:20px;font-weight:700;color:#9be7ff}
.done .count{display:none}.done .soon{display:block}

.prog{margin:18px auto 0;max-width:400px}
.progtop{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-bottom:8px}
.bar{height:10px;border-radius:99px;background:rgba(6,9,36,.7);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#22d3ee);background-size:200% 100%;box-shadow:0 0 18px rgba(90,150,255,.7);position:relative;transition:width 1.2s cubic-bezier(.2,.8,.2,1);animation:flow 3s linear infinite}
.bar i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.22) 0 10px,transparent 10px 20px);animation:stripes 1s linear infinite}
@keyframes flow{to{background-position:200% 0}}
@keyframes stripes{to{background-position:20px 0}}

.steps{list-style:none;margin:16px auto 0;max-width:400px;text-align:left;display:grid;gap:7px}
.steps li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;font-size:13px;color:#c7d3f6;background:rgba(6,9,36,.4);border:1px solid transparent;opacity:0;animation:slide .6s cubic-bezier(.2,.8,.2,1) forwards}
.steps li:nth-child(1){animation-delay:.5s}.steps li:nth-child(2){animation-delay:.65s}.steps li:nth-child(3){animation-delay:.8s}.steps li:nth-child(4){animation-delay:.95s}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.steps li.active{border-color:rgba(120,160,255,.35);background:rgba(60,90,220,.16);color:#fff}
.steps li.todo{color:#7c89b4}
.ic{flex:0 0 20px;width:20px;height:20px;display:grid;place-items:center}
.ic svg{width:20px;height:20px}
.spin{animation:spin 1s linear infinite;transform-origin:50% 50%}
.term{margin:14px auto 0;max-width:400px;min-height:20px;text-align:left;font-size:12px;color:#7ee0c3}
.caret{display:inline-block;width:7px;height:14px;margin-left:3px;vertical-align:-2px;background:#7ee0c3;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;min-height:42px;border-radius:13px;font:600 13.5px Inter,system-ui,sans-serif;color:#fff;text-decoration:none;border:1px solid var(--line);background:rgba(20,28,80,.55);cursor:pointer;transition:transform .15s,border-color .2s,background .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.btn:hover{transform:translateY(-2px);border-color:rgba(130,170,255,.6);box-shadow:0 10px 30px -10px rgba(80,130,255,.7)}
.btn:active{transform:scale(.97)}
.btn.main{border:0;background:linear-gradient(135deg,#3b82f6,#8b5cf6);box-shadow:0 10px 30px -10px rgba(110,100,255,.9)}
.btn svg{width:16px;height:16px}
.btn:focus-visible,.lang:focus-visible{outline:2px solid #7db3ff;outline-offset:3px}
.btn.busy svg{animation:spin 1s linear infinite}
.hint{margin-top:14px;font-size:11.5px;color:#7480aa}
.foot{position:relative;z-index:5;margin-top:16px;font-size:11.5px;color:#6b78a6;text-align:center}
.foot a{color:#9db4ff;text-decoration:none}

.lang{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:40;padding:8px 12px;border-radius:999px;font:600 11.5px Inter,system-ui,sans-serif;color:#cfd9ff;background:rgba(14,20,58,.6);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer;min-height:36px}
.lang b{color:#fff}.lang span{opacity:.55}
.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,30px);z-index:50;padding:11px 16px;border-radius:13px;font-size:13.5px;background:rgba(14,20,58,.92);border:1px solid rgba(130,170,255,.4);box-shadow:0 14px 40px -12px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-height:700px){.logo{width:68px;height:68px;margin-bottom:8px}.logo svg{width:44px;height:44px}.steps{display:none}.card{padding-top:18px;padding-bottom:18px}}
@media (pointer:coarse){#orb{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.blob,.grid{animation:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><div class="grid"></div></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="orb" aria-hidden="true"></div>
<button class="lang" id="lang" type="button" aria-label="Change language"><b data-l="en">EN</b> <span>/</span> <span data-l="id">ID</span></button>

<main class="stage">
  <section class="card" id="card">
    <div class="logo" id="logo" title="">
      <i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i>
      <svg viewBox="0 0 64 64" role="img" aria-label="NexScript">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
        <path d="M32 3 55 11v19c0 15-9.6 25.6-23 31C18.6 55.6 9 45 9 30V11z" fill="rgba(20,30,90,.7)" stroke="url(#lg)" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M21 44V21l22 22V20" fill="none" stroke="url(#lg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="chip"><i></i><span data-i="chip"></span></p>
    <h1 data-i="title"></h1>
    <p class="sub" data-i="sub"></p>

    <div id="etabox">
      <p class="eta" data-i="eta"></p>
      <div class="count" id="count" role="timer" aria-live="off">
        <div class="unit"><span class="num" id="d">00</span><span class="lab" data-i="d"></span></div>
        <div class="unit"><span class="num" id="h">00</span><span class="lab" data-i="h"></span></div>
        <div class="unit"><span class="num" id="m">00</span><span class="lab" data-i="m"></span></div>
        <div class="unit"><span class="num" id="s">00</span><span class="lab" data-i="s"></span></div>
      </div>
      <p class="soon hd" data-i="soon"></p>
    </div>

    <div class="prog">
      <div class="progtop"><span data-i="prog"></span><span id="pct" class="mono">0%</span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="barwrap"><i id="fill"></i></div>
    </div>

    <ul class="steps" id="steps"></ul>
    <p class="term mono" aria-hidden="true"><span id="term"></span><i class="caret"></i></p>

    <div class="actions">
      <button class="btn main" id="again" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-15-6.7L3 8M3 3v5h5M3 12a9 9 0 0 0 15 6.7L21 16M21 21v-5h-5"/></svg><span data-i="again"></span></button>
      <a class="btn" id="discord" href="#" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 5a17 17 0 0 0-4.2-1.3l-.5 1a15 15 0 0 0-4.6 0l-.5-1A17 17 0 0 0 6 5C3.3 9 2.6 12.900 3 16.700a17 17 0 0 0 5.200 2.600l1.100-1.800c-.6-.2-1.200-.5-1.700-.9l.4-.3a12 12 0 0 0 10 0l.4.300c-.5.400-1.100.700-1.700.900l1.100 1.800a17 17 0 0 0 5.200-2.600c.5-4.400-.8-8.200-3-11.700zM9.500 14.500c-.9 0-1.600-.8-1.600-1.800s.7-1.800 1.600-1.800 1.600.8 1.600 1.800-.7 1.800-1.600 1.800zm5 0c-.9 0-1.600-.8-1.600-1.800s.7-1.800 1.600-1.800 1.600.8 1.600 1.800-.7 1.800-1.600 1.800z"/></svg><span data-i="discord"></span></a>
      <a class="btn" id="youtube" href="#" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 8.200a3 3 0 0 0-2.100-2.100C18 5.600 12 5.600 12 5.600s-6 0-7.900.5A3 3 0 0 0 2 8.200 31 31 0 0 0 1.500 12 31 31 0 0 0 2 15.800a3 3 0 0 0 2.100 2.100c1.900.5 7.900.5 7.900.5s6 0 7.900-.5a3 3 0 0 0 2.100-2.100c.4-1.200.5-2.500.5-3.800s-.1-2.600-.5-3.800zM10 15V9l5.200 3z"/></svg><span>YouTube</span></a>
    </div>
    <p class="hint" data-i="hint"></p>
  </section>
  <p class="foot"><span id="year"></span> NexScript &middot; <span data-i="by"></span> <a href="https://github.com/SCRIPTERcrazy-web" target="_blank" rel="noopener noreferrer">ThisIsBacon</a></p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

var CONFIG={
  // 2 hari dari sekarang (otomatis). Ganti dengan tanggal pasti jika mau.
  returnAt:(function(){var d=new Date();d.setDate(d.getDate()+2);return d.toISOString()})(),
  startAt:new Date().toISOString(),
  progress:null,
  discord:'https://discord.gg/ET2gVgNdS',
  youtube:'https://www.youtube.com/@This-IsBacon',
  steps:[['db','done'],['deploy','active'],['test','todo']],
  checkEvery:45000
};

var T={
 en:{chip:'Scheduled maintenance',title:"We'll be right back",
  sub:'NexScript is getting a big upgrade: new features, faster servers and a safer community. Hang tight, it will be worth the wait.',
  eta:'Back online in',d:'days',h:'hours',m:'min',s:'sec',soon:'Almost there...',prog:'Upgrade progress',
  again:'Check again',checking:'Checking...',still:'Still working on it. This page refreshes by itself.',
  discord:'Join Discord',hint:'Move your mouse or touch the screen. Press and hold to pull the particles in.',by:'made by',
  db:'Backup and database upgrade',deploy:'Deploying new features',test:'Final tests and cache warm-up',
  logs:['> backing up the database...','> optimizing images...','> deploying community update...','> warming up the cache...','> running final checks...'],
  boom:'Boom!'},
 id:{chip:'Maintenance terjadwal',title:'Kami segera kembali',
  sub:'NexScript sedang di-upgrade besar-besaran: fitur baru, server lebih cepat, dan komunitas lebih aman. Tunggu sebentar ya, pasti worth it.',
  eta:'Online lagi dalam',d:'hari',h:'jam',m:'mnt',s:'dtk',soon:'Sebentar lagi...',prog:'Progres upgrade',
  again:'Cek lagi',checking:'Mengecek...',still:'Masih dikerjakan. Halaman ini refresh sendiri.',
  discord:'Gabung Discord',hint:'Gerakkan mouse atau sentuh layar. Tekan dan tahan untuk menarik partikel.',by:'dibuat oleh',
  db:'Backup dan upgrade database',deploy:'Memasang fitur baru',test:'Tes akhir dan pemanasan cache',
  logs:['> membackup database...','> mengoptimalkan gambar...','> memasang update komunitas...','> memanaskan cache...','> menjalankan pengecekan akhir...'],
  boom:'Duar!'}
};
var lang=(function(){try{var q=new URLSearchParams(location.search).get('lang');if(q==='id'||q==='en')return q;var s=localStorage.getItem('nx_mt_lang');if(s==='id'||s==='en')return s}catch(e){}return /^id|^ms/i.test(navigator.language||'')?'id':'en'})();

var $=function(id){return document.getElementById(id)};
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
// deteksi device lemah: layar kecil / touch / CPU sedikit
var lowPower=coarse||innerWidth<760||(navigator.hardwareConcurrency||4)<=4;

var endMs,startMs;
(function(){
  var now=Date.now();
  if(CONFIG.returnAt){endMs=new Date(CONFIG.returnAt).getTime();startMs=CONFIG.startAt?new Date(CONFIG.startAt).getTime():now}
  if(!isFinite(endMs)||!endMs){
    var s=null;try{s=JSON.parse(localStorage.getItem('nx_mt_demo'))}catch(e){}
    if(!s||s.end<now-3600000){s={start:now,end:now+2*3600000};try{localStorage.setItem('nx_mt_demo',JSON.stringify(s))}catch(e){}}
    startMs=s.start;endMs=s.end;
  }
})();

var STEP_ICON={
  done:'<svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5" stroke-opacity=".5"/><path d="M7.5 12.5l3 3 6-6.500"/></svg>',
  active:'<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="#7db3ff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-opacity=".25"/><path d="M21 12a9 9 0 0 0-9-9"/></svg>',
  todo:'<svg viewBox="0 0 24 24" fill="none" stroke="#5b6894" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>'
};
function applyLang(){
  var t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(function(el){var v=t[el.getAttribute('data-i')];if(v!==undefined)el.textContent=v});
  document.querySelectorAll('[data-l]').forEach(function(el){el.style.opacity=el.getAttribute('data-l')===lang?'1':'.5';el.style.fontWeight=el.getAttribute('data-l')===lang?'700':'500'});
  $('steps').innerHTML=CONFIG.steps.map(function(s){return '<li class="'+s[1]+'"><span class="ic">'+STEP_ICON[s[1]]+'</span><span>'+(t[s[0]]||s[0])+'</span></li>'}).join('');
  $('logo').title=t.boom;
  try{localStorage.setItem('nx_mt_lang',lang)}catch(e){}
  typeIdx=-1;
}
$('lang').addEventListener('click',function(){lang=lang==='en'?'id':'en';applyLang()});
$('discord').href=CONFIG.discord||'#';$('youtube').href=CONFIG.youtube||'#';
if(!CONFIG.discord)$('discord').style.display='none';if(!CONFIG.youtube)$('youtube').style.display='none';
$('year').textContent='\u00A9 '+new Date().getFullYear();

var last={d:'',h:'',m:'',s:''};
function pad(n){return n<10?'0'+n:''+n}
function tickClock(){
  var left=Math.max(0,endMs-Date.now());
  var sec=Math.floor(left/1000),v={d:pad(Math.floor(sec/86400)),h:pad(Math.floor(sec%86400/3600)),m:pad(Math.floor(sec%3600/60)),s:pad(sec%60)};
  for(var k in v){if(v[k]!==last[k]){var el=$(k);el.textContent=v[k];if(last[k]!==''){el.classList.remove('tick');void el.offsetWidth;el.classList.add('tick')}last[k]=v[k]}}
  $('etabox').classList.toggle('done',left<=0);
  var pct;
  if(typeof CONFIG.progress==='number')pct=CONFIG.progress;
  else pct=Math.round(Math.max(4,Math.min(99,(Date.now()-startMs)/Math.max(1,endMs-startMs)*100)));
  $('fill').style.width=pct+'%';$('pct').textContent=pct+'%';$('barwrap').setAttribute('aria-valuenow',pct);
}
setInterval(tickClock,1000);

var typeIdx=-1,typeChar=0,typeHold=0;
function typeLoop(){
  var logs=T[lang].logs;
  if(typeIdx<0){typeIdx=0;typeChar=0;typeHold=0}
  var line=logs[typeIdx%logs.length];
  if(typeChar<line.length){typeChar++;$('term').textContent=line.slice(0,typeChar);setTimeout(typeLoop,reduce?0:34)}
  else if(typeHold<1){typeHold=1;setTimeout(typeLoop,1700)}
  else{typeIdx++;typeChar=0;typeHold=0;setTimeout(typeLoop,250)}
}

var toastT=null;
function toast(msg){var el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show')},3200)}
var checking=false;
function check(manual){
  if(checking)return;checking=true;var b=$('again');b.classList.add('busy');
  if(manual)b.querySelector('span').textContent=T[lang].checking;
  fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.text().then(function(txt){return{ok:r.ok,txt:txt}})}).then(function(r){
    if(r.ok&&r.txt.indexOf('data-maintenance-page')<0){location.reload();return}
    if(manual)toast(T[lang].still);
  }).catch(function(){if(manual)toast(T[lang].still)}).then(function(){checking=false;b.classList.remove('busy');b.querySelector('span').textContent=T[lang].again});
}
$('again').addEventListener('click',function(){check(true)});
(function loop(){setTimeout(function(){if(!document.hidden)check(false);loop()},CONFIG.checkEvery+Math.random()*4000)})();

var cv=$('fx'),ctx=cv.getContext('2d',{alpha:true});
var W=0,H=0,DPR=1,quality=1;
var COLORS=['96,165,250','167,139,250','34,211,238','244,114,182','52,211,153'];
var parts=[],sparks=[],rings=[];
var pointers={};
var lastInput=0,frameMs=16,slow=0;
var MAXSPARK=reduce?0:(coarse?60:110);

function rnd(a,b){return a+Math.random()*(b-a)}
function targetCount(){
  var base=W*H/(coarse?26000:20000);
  var cap=coarse?45:80;
  return Math.max(24,Math.min(cap,Math.round(base*(reduce?.3:1)*quality)));
}
function makeP(){
  var a=Math.random()*6.283,sp=rnd(.08,.34);
  var p={x:rnd(0,W),y:rnd(0,H),bx:Math.cos(a)*sp,by:Math.sin(a)*sp,vx:0,vy:0,r:rnd(1,2.2),c:COLORS[(Math.random()*COLORS.length)|0],tw:Math.random()*6.283};
  p.vx=p.bx;p.vy=p.by;return p;
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  var n=targetCount();while(parts.length<n)parts.push(makeP());if(parts.length>n)parts.length=n;
}
var rsT=null;addEventListener('resize',function(){clearTimeout(rsT);rsT=setTimeout(resize,120)});

function spark(x,y,vx,vy,life,size,col){
  if(!MAXSPARK)return;if(sparks.length>=MAXSPARK)sparks.shift();
  sparks.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,r:size,c:col||COLORS[(Math.random()*COLORS.length)|0]});
}
function burst(x,y,n,power,col){
  rings.push({x:x,y:y,r:4,v:power*1.4,life:1,c:col||'125,175,255'});
  for(var i=0;i<n;i++){var a=Math.random()*6.283,s=rnd(.4,1)*power;spark(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(34,70),rnd(1.2,2.8))}
}
function shock(x,y,radius,force){
  for(var i=0;i<parts.length;i++){
    var p=parts[i],dx=p.x-x,dy=p.y-y,d=Math.sqrt(dx*dx+dy*dy)||1;
    if(d<radius){var f=(1-d/radius)*force;p.vx+=dx/d*f;p.vy+=dy/d*f}
  }
}

var orb=$('orb');
var card=$('card'),tilt={x:0,y:0,tx:0,ty:0},spot={x:.5,y:0,tx:.5,ty:0};
function ptr(id,x,y){
  var p=pointers[id];if(!p){p=pointers[id]={x:x,y:y,px:x,py:y,down:false,t0:0}}
  p.px=p.x;p.py=p.y;p.x=x;p.y=y;return p;
}
function moved(id,x,y,touch){
  var p=ptr(id,x,y);lastInput=performance.now();
  var dx=p.x-p.px,dy=p.y-p.py,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>1.5&&!reduce){
    var n=Math.min(3,1+(dist/18)|0);
    for(var i=0;i<n;i++){var t=i/n;spark(p.px+dx*t,p.py+dy*t,rnd(-.5,.5)-dx*.02,rnd(-.5,.5)-dy*.02,rnd(26,52),rnd(1,2.4))}
  }
  if(!touch){orb.classList.add('on');}
  if(!reduce&&!lowPower){tilt.ty=((x/W)-.5)*-9;tilt.tx=((y/H)-.5)*7}
}
function pressed(id,x,y,touch){
  var p=ptr(id,x,y);p.down=true;p.t0=performance.now();lastInput=p.t0;
  burst(x,y,reduce?0:10,2.2,'160,200,255');
  if(!touch)orb.classList.add('down');
  if(touch&&navigator.vibrate){try{navigator.vibrate(8)}catch(e){}}
}
function released(id){
  var p=pointers[id];if(!p)return;
  var held=performance.now()-p.t0;
  if(p.down&&held>260){burst(p.x,p.y,reduce?0:36,Math.min(6,3+held/380),'244,114,182');shock(p.x,p.y,260,Math.min(9,4+held/260))}
  else if(p.down){shock(p.x,p.y,150,3)}
  p.down=false;orb.classList.remove('down');
}
addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;moved('m'+e.pointerId,e.clientX,e.clientY,false)},{passive:true});
addEventListener('pointerdown',function(e){if(e.pointerType==='touch')return;pressed('m'+e.pointerId,e.clientX,e.clientY,false)},{passive:true});
addEventListener('pointerup',function(e){if(e.pointerType==='touch')return;released('m'+e.pointerId)},{passive:true});
document.addEventListener('mouseleave',function(){orb.classList.remove('on');tilt.tx=0;tilt.ty=0;for(var k in pointers)if(k[0]==='m')delete pointers[k]});
function eachTouch(e,fn){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fn('t'+t.identifier,t.clientX,t.clientY)}}
addEventListener('touchstart',function(e){eachTouch(e,function(id,x,y){pressed(id,x,y,true)})},{passive:true});
addEventListener('touchmove',function(e){eachTouch(e,function(id,x,y){moved(id,x,y,true)})},{passive:true});
function touchEnd(e){eachTouch(e,function(id){released(id);delete pointers[id]});tilt.tx=0;tilt.ty=0}
addEventListener('touchend',touchEnd,{passive:true});addEventListener('touchcancel',touchEnd,{passive:true});
$('logo').addEventListener('click',function(e){var r=$('logo').getBoundingClientRect();var x=r.left+r.width/2,y=r.top+r.height/2;burst(x,y,reduce?0:60,5,'96,165,250');shock(x,y,340,8);toast(T[lang].boom)});

var orbX=-100,orbY=-100,tPrev=performance.now(),acc=0,frames=0;
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden){tPrev=now;return}
  var raw=now-tPrev;tPrev=now;var dt=Math.min(3,raw/16.667);
  frameMs=frameMs*.94+raw*.06;acc+=raw;frames++;
  if(acc>2000){
    if(frameMs>22&&quality>.3){quality=Math.max(.3,quality-.25);resize()}
    else if(frameMs<17&&quality<1&&frames>120){quality=Math.min(1,quality+.05);resize()}
    acc=0;frames=0;
  }

  var idle=!reduce&&!lowPower&&(now-lastInput>3800)&&Object.keys(pointers).filter(function(k){return k!=='ghost'}).length===0;
  if(idle){
    var gx=W*.5+Math.cos(now*.00052)*W*.3,gy=H*.5+Math.sin(now*.00083)*H*.26;
    var g=ptr('ghost',gx,gy);
    if(Math.random()<.5)spark(g.x,g.y,rnd(-.4,.4),rnd(-.4,.4),rnd(24,44),rnd(1,2));
  }else if(pointers.ghost)delete pointers.ghost;

  var plist=[];for(var k in pointers)plist.push(pointers[k]);
  var R=coarse?110:140;

  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  var fr=Math.pow(.985,dt);
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    for(var j=0;j<plist.length;j++){
      var pt=plist[j],dx=pt.x-p.x,dy=pt.y-p.y,d2=dx*dx+dy*dy,rr=pt.down?R*1.6:R;
      if(d2<rr*rr){
        var d=Math.sqrt(d2)||1,f=1-d/rr;
        if(pt.down){var held=Math.min(1.8,(now-pt.t0)/700+.6);p.vx+=dx/d*f*.9*held*dt;p.vy+=dy/d*f*.9*held*dt;p.vx+=-dy/d*f*.35*dt;p.vy+=dx/d*f*.35*dt}
        else if(!reduce){p.vx+=dx/d*f*.05*dt+(-dy/d)*f*.045*dt;p.vy+=dy/d*f*.05*dt+(dx/d)*f*.045*dt}
      }
    }
    p.vx=(p.vx-p.bx)*fr+p.bx;p.vy=(p.vy-p.by)*fr+p.by;
    var sp=Math.sqrt(p.vx*p.vx+p.vy*p.vy);if(sp>9){p.vx*=9/sp;p.vy*=9/sp}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.tw+=.03*dt;
    if(p.x<-20)p.x=W+20;else if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;else if(p.y>H+20)p.y=-20;
  }

  var L=coarse?85:100,L2=L*L;
  ctx.lineWidth=1;
  for(var a=0;a<parts.length;a++){
    var pa=parts[a];
    for(var b=a+1;b<parts.length;b++){
      var pb=parts[b],ddx=pa.x-pb.x;if(ddx>L||ddx<-L)continue;var ddy=pa.y-pb.y;if(ddy>L||ddy<-L)continue;
      var dd=ddx*ddx+ddy*ddy;
      if(dd<L2){ctx.strokeStyle='rgba('+pa.c+','+((1-Math.sqrt(dd)/L)*.32).toFixed(3)+')';ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke()}
    }
  }
  for(var q=0;q<plist.length;q++){
    var pt2=plist[q],rr2=(pt2.down?R*1.6:R*1.1);
    for(var c=0;c<parts.length;c++){
      var pc=parts[c],ex=pt2.x-pc.x,ey=pt2.y-pc.y,e2=ex*ex+ey*ey;
      if(e2<rr2*rr2){var al=(1-Math.sqrt(e2)/rr2)*(pt2.down?.8:.55);ctx.strokeStyle='rgba(170,210,255,'+al.toFixed(3)+')';ctx.lineWidth=pt2.down?1.3:1;ctx.beginPath();ctx.moveTo(pt2.x,pt2.y);ctx.lineTo(pc.x,pc.y);ctx.stroke()}
    }
    if(pt2.down){var gr=ctx.createRadialGradient(pt2.x,pt2.y,0,pt2.x,pt2.y,60);gr.addColorStop(0,'rgba(244,114,182,.42)');gr.addColorStop(1,'rgba(244,114,182,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(pt2.x,pt2.y,60,0,6.283);ctx.fill()}
  }
  for(var n=0;n<parts.length;n++){
    var pn=parts[n],tw=.65+Math.sin(pn.tw)*.35;
    ctx.fillStyle='rgba('+pn.c+','+(.16*tw).toFixed(3)+')';ctx.beginPath();ctx.arc(pn.x,pn.y,pn.r*4.2,0,6.283);ctx.fill();
    ctx.fillStyle='rgba('+pn.c+','+(.95*tw).toFixed(3)+')';ctx.beginPath();ctx.arc(pn.x,pn.y,pn.r,0,6.283);ctx.fill();
  }
  for(var s=sparks.length-1;s>=0;s--){
    var sk=sparks[s];sk.life-=dt;if(sk.life<=0){sparks.splice(s,1);continue}
    sk.vx*=Math.pow(.96,dt);sk.vy*=Math.pow(.96,dt);sk.x+=sk.vx*dt;sk.y+=sk.vy*dt;
    var la=sk.life/sk.max;
    ctx.fillStyle='rgba('+sk.c+','+(la*.9).toFixed(3)+')';ctx.beginPath();ctx.arc(sk.x,sk.y,sk.r*(.5+la*.8),0,6.283);ctx.fill();
    ctx.fillStyle='rgba('+sk.c+','+(la*.14).toFixed(3)+')';ctx.beginPath();ctx.arc(sk.x,sk.y,sk.r*4,0,6.283);ctx.fill();
  }
  for(var r=rings.length-1;r>=0;r--){
    var rg=rings[r];rg.r+=rg.v*dt;rg.v*=Math.pow(.95,dt);rg.life-=.028*dt;if(rg.life<=0){rings.splice(r,1);continue}
    ctx.strokeStyle='rgba('+rg.c+','+(rg.life*.6).toFixed(3)+')';ctx.lineWidth=2.2*rg.life+.4;ctx.beginPath();ctx.arc(rg.x,rg.y,rg.r,0,6.283);ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';

  var real=null;for(var k2 in pointers){if(k2[0]==='m')real=pointers[k2]}
  if(real&&!coarse){orbX+=(real.x-orbX)*.22*Math.min(dt,1.5);orbY+=(real.y-orbY)*.22*Math.min(dt,1.5);orb.style.transform='translate3d('+orbX+'px,'+orbY+'px,0)'}
  if(!reduce&&!lowPower){
    tilt.x+=(tilt.tx-tilt.x)*.08*dt;tilt.y+=(tilt.ty-tilt.y)*.08*dt;
    card.style.transform='perspective(1000px) rotateX('+tilt.x.toFixed(2)+'deg) rotateY('+tilt.y.toFixed(2)+'deg)';
    var pp=real||plist[plist.length-1];
    if(pp){var cr=card.getBoundingClientRect();spot.tx=(pp.x-cr.left)/cr.width;spot.ty=(pp.y-cr.top)/cr.height}
    spot.x+=(spot.tx-spot.x)*.12*dt;spot.y+=(spot.ty-spot.y)*.12*dt;
    card.style.setProperty('--mx',(spot.x*100).toFixed(1)+'%');card.style.setProperty('--my',(spot.y*100).toFixed(1)+'%');
  }
}

applyLang();tickClock();resize();typeLoop();
if(reduce){frame(performance.now())}
else{requestAnimationFrame(frame)}
setTimeout(function(){if(!reduce)burst(W*.5,H*.38,30,3.5,'125,175,255')},600);
})();
</script>
</body>
</html>
